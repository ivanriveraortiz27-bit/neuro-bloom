<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neuro Bloom - Creciendo con cada emoción</title>
    
    <link rel="icon" href="https://i.ibb.co/WWs5xcSX/Neuro-Bloom-Logo-nbg.png" type="image/png">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=Nunito:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="styles.css">
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Nunito', 'sans-serif'],
                        serif: ['Lora', 'serif'],
                    },
                    colors: {
                        brand: {
                            purple: '#81638b',
                            lilac: '#b695c0',
                            green: '#9BC496',
                            blue: '#81c9fa',
                            dark: '#4a444d'
                        }
                    },
                    boxShadow: {
                        'glass': '0 8px 32px 0 rgba(129, 99, 139, 0.05)',
                    }
                }
            }
        }
    </script>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.23.6/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
</head>
<body>
    <div id="root">
        <div class="loading-screen">
            <h2 class="loading-title">Cargando Neuro Bloom...</h2>
            <p>Si este mensaje no desaparece en unos segundos, revisa tu conexión a internet.</p>
        </div>
    </div>

    <script>
        window.onerror = function(message, source, lineno, colno, error) {
            const root = document.getElementById('root');
            root.innerHTML = `
                <div class="error-container">
                    <h3 class="error-title">⚠️ Ocurrió un error al cargar</h3>
                    <p><strong>Mensaje:</strong> ${message}</p>
                    <p><strong>Línea:</strong> ${lineno}</p>
                    <p>Por favor, verifica que tienes conexión a internet.</p>
                </div>
            `;
            console.error(error);
        };
    </script>

    <script type="text/babel">
        try {
            const { useState, useEffect, useRef } = React;

            // --- Iconos Globales ---
            const IconWrapper = ({ name, size = 24, className, color, fill = "none", ...props }) => {
                const iconRef = useRef(null);
                useEffect(() => {
                    if (window.lucide) {
                        window.lucide.createIcons({
                            root: iconRef.current,
                            nameAttr: 'data-lucide',
                            attrs: { width: size, height: size, stroke: color || 'currentColor', fill: fill, class: className, ...props }
                        });
                    }
                }, [name, size, className, color, fill]);
                return <i ref={iconRef} data-lucide={name} style={{ display: 'inline-flex' }}></i>;
            };

            const Heart = (props) => <IconWrapper name="heart" {...props} />;
            const Activity = (props) => <IconWrapper name="activity" {...props} />;
            const HeartHandshake = (props) => <IconWrapper name="heart-handshake" {...props} />;
            const Sun = (props) => <IconWrapper name="sun" {...props} />;
            const Calendar = (props) => <IconWrapper name="calendar" {...props} />;
            const Menu = (props) => <IconWrapper name="menu" {...props} />;
            const X = (props) => <IconWrapper name="x" {...props} />;
            const ArrowLeft = (props) => <IconWrapper name="arrow-left" {...props} />;
            const Shield = (props) => <IconWrapper name="shield" {...props} />;
            const Brain = (props) => <IconWrapper name="brain" {...props} />;
            const BookHeart = (props) => <IconWrapper name="book-heart" {...props} />;
            const PlayCircle = (props) => <IconWrapper name="play-circle" {...props} />;
            const Library = (props) => <IconWrapper name="library" {...props} />;

            // Helper para convertir el nombre de icono del JSON a Componente React
            const getIconComponent = (name, props = {}) => {
                switch(name) {
                    case 'activity': return <Activity {...props} />;
                    case 'heart': return <Heart {...props} />;
                    case 'heart-handshake': return <HeartHandshake {...props} />;
                    case 'sun': return <Sun {...props} />;
                    case 'shield': return <Shield {...props} />;
                    case 'brain': return <Brain {...props} />;
                    case 'book-heart': return <BookHeart {...props} />;
                    case 'play-circle': return <PlayCircle {...props} />;
                    case 'library': return <Library {...props} />;
                    default: return <Activity {...props} />;
                }
            };

            // Componente Inteligente de Miniatura (Manejo de Error)
            const Thumbnail = ({ src, alt, fallback, className }) => {
                const [error, setError] = useState(false);
                if (error || !src) {
                    return fallback;
                }
                return <img src={src} alt={alt} onError={() => setError(true)} className={className} />;
            };

            // --- DATOS GLOBALES FIJOS ---
            const colors = {
                primary: '#81638b',
                secondary: '#b695c0',
                actionBlue: '#2196f3',
                brainGreen: '#9BC496',
                white: '#FFFFFF',
            };

            const logoUrl = "https://i.ibb.co/WWs5xcSX/Neuro-Bloom-Logo-nbg.png";
            const advertenciaCuestionario = "Este cuestionario es una herramienta de orientación y reflexión personal. No sustituye una evaluación, diagnóstico ni tratamiento psicológico o médico profesional. Si te identificas con varios de los síntomas o sientes que el agotamiento está afectando tu vida diaria, buscar acompañamiento profesional puede ser un paso importante para tu bienestar.";

            // --- COMPONENTES UI ---
            const Logo = ({ className }) => (
                <div className={`flex items-center gap-3 ${className}`}>
                    <img src={logoUrl} alt="Neuro Bloom Logo" className="h-full w-auto object-contain drop-shadow-sm" />
                </div>
            );

            const NavButton = ({ active, onClick, children, icon }) => (
                <button
                    onClick={onClick}
                    className={`flex items-center gap-2 px-5 py-2 rounded-full transition-all duration-300 text-[15px] font-bold tracking-wide border ${
                        active 
                        ? 'bg-brand-purple/90 text-white border-brand-purple shadow-md transform scale-105' 
                        : 'bg-white/40 text-brand-purple border-white/60 hover:bg-white/70 hover:shadow-sm'
                    }`}
                >
                    {React.cloneElement(icon, { size: 18, color: active ? colors.white : colors.primary })}
                    <span className="hidden lg:inline">{children}</span>
                </button>
            );

            // Botón de Regreso Unificado
            const BackButton = ({ onClick, text = "Volver" }) => (
                <button onClick={onClick} className="flex items-center gap-2 mb-8 text-stone-500 hover:text-brand-purple transition-colors font-bold group w-fit bg-white/60 backdrop-blur-sm px-4 py-2 rounded-full border border-white shadow-sm">
                    <ArrowLeft size={18} className="group-hover:-translate-x-1 transition-transform text-brand-purple" />
                    <span className="text-stone-600">{text}</span>
                </button>
            );

            const CuestionarioView = ({ data, onBack }) => {
                const [respuestas, setRespuestas] = useState({});
                const [resultado, setResultado] = useState(null);

                const calcularPuntaje = () => {
                    const total = Object.values(respuestas).reduce((a, b) => a + b, 0);
                    setResultado(total);
                };

                return (
                    <div className="animate-fadeIn bg-white/70 backdrop-blur-xl p-8 lg:p-12 rounded-[2rem] shadow-glass border border-white/60 max-w-4xl mx-auto">
                        <BackButton onClick={onBack} text="Volver a Cuestionarios" />
                        
                        <div className="flex items-center gap-4 mb-6">
                            <div className="p-3 rounded-full text-white shadow-md" style={{ backgroundColor: data.color || colors.primary }}>
                                {getIconComponent(data.icon)}
                            </div>
                            <h2 className="text-4xl font-serif font-bold text-stone-800" style={{ color: colors.primary }}>{data.title}</h2>
                        </div>
                        
                        {data.intro && <p className="text-lg text-stone-600 mb-8 leading-relaxed">{data.intro}</p>}
                        
                        <div className="bg-orange-50/80 backdrop-blur-sm border-l-4 border-orange-300 p-5 mb-10 rounded-r-2xl">
                            <p className="text-sm text-orange-800 font-medium leading-relaxed">{advertenciaCuestionario}</p>
                        </div>

                        <div className="space-y-6">
                            {data.preguntas.map((pregunta, idx) => (
                                <div key={idx} className="bg-white/80 p-6 rounded-2xl border border-white shadow-sm hover:shadow-md transition-shadow">
                                    <p className="font-semibold text-stone-800 mb-4 text-lg">{idx + 1}. {pregunta}</p>
                                    <div className="flex flex-wrap gap-3">
                                        {data.opciones.map((opc, oIdx) => (
                                            <button 
                                                key={oIdx}
                                                onClick={() => setRespuestas({...respuestas, [idx]: opc.v})}
                                                className={`px-5 py-2.5 rounded-full text-sm font-bold transition-all border ${
                                                    respuestas[idx] === opc.v 
                                                    ? 'bg-white shadow-md scale-105' 
                                                    : 'bg-stone-50/50 border-stone-200 hover:border-stone-300 text-stone-500 hover:bg-white'
                                                }`}
                                                style={{ 
                                                    borderColor: respuestas[idx] === opc.v ? (data.color || colors.primary) : '',
                                                    color: respuestas[idx] === opc.v ? (data.color || colors.primary) : '' 
                                                }}
                                            >
                                                {opc.l}
                                            </button>
                                        ))}
                                    </div>
                                </div>
                            ))}
                        </div>

                        <div className="mt-12 text-center">
                            <button 
                                onClick={calcularPuntaje}
                                disabled={Object.keys(respuestas).length < data.preguntas.length}
                                className="px-10 py-4 rounded-full text-white font-bold text-lg shadow-lg disabled:opacity-50 disabled:cursor-not-allowed transition-all hover:-translate-y-1"
                                style={{ backgroundColor: colors.primary }}
                            >
                                Ver Resultado Orientativo
                            </button>
                        </div>

                        {resultado !== null && (
                            <div className="mt-12 p-8 lg:p-10 rounded-3xl bg-indigo-50/80 backdrop-blur-sm border border-indigo-100 animate-slideIn text-center shadow-inner">
                                <h3 className="text-3xl font-serif font-bold mb-6" style={{ color: colors.primary }}>Tu puntuación: {resultado}</h3>
                                <div className="space-y-4 mb-8 text-left max-w-2xl mx-auto">
                                    {data.interpretacion.map((int, i) => (
                                        <div key={i} className="p-5 bg-white/90 rounded-2xl border border-white shadow-sm text-stone-700 text-lg">
                                            <strong className="text-brand-purple">{int.rango}:</strong> {int.texto}
                                        </div>
                                    ))}
                                </div>
                                {data.guion && (
                                    <div className="p-8 bg-white/90 rounded-3xl text-stone-600 shadow-sm border border-white">
                                        <h4 className="font-serif font-bold mb-3 text-xl" style={{ color: colors.primary }}>Reflexión</h4>
                                        <p className="italic text-lg leading-relaxed">"{data.guion}"</p>
                                    </div>
                                )}
                            </div>
                        )}
                    </div>
                );
            };

            function NeuroBloom() {
                const [activeSection, setActiveSection] = useState('home');
                const [subView, setSubView] = useState(null);
                const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
                const [indicadoresTab, setIndicadoresTab] = useState('info'); 
                
                const [appData, setAppData] = useState(null);
                const [dataError, setDataError] = useState(false);

                useEffect(() => {
                    fetch('./data.json')
                        .then(res => {
                            if (!res.ok) throw new Error("No se pudo cargar data.json");
                            return res.json();
                        })
                        .then(data => setAppData(data))
                        .catch(err => {
                            console.error(err);
                            setDataError(true);
                        });
                }, []);

                useEffect(() => {
                    setSubView(null);
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                }, [activeSection, subView]);

                if (dataError) {
                    return (
                        <div className="loading-screen bg-red-50 text-stone-800 p-8">
                            <h2 className="text-2xl text-red-600 font-bold mb-4 font-serif">Error al cargar datos</h2>
                            <p className="max-w-xl text-center mb-4">Revisa la consola o asegúrate de estar utilizando un Live Server local.</p>
                        </div>
                    );
                }

                if (!appData) {
                    return (
                        <div className="loading-screen">
                            <h2 className="loading-title animate-pulse">Despertando Neuro Bloom...</h2>
                        </div>
                    );
                }

                const renderContent = () => {
                    switch (activeSection) {
                        case 'home':
                            return (
                                <div className="animate-fadeIn flex flex-col items-center justify-center text-center py-8 lg:py-16">
                                    <img src={logoUrl} alt="Neuro Bloom" className="w-full max-w-lg h-auto mx-auto drop-shadow-md mb-8" />
                                    
                                    <h1 className="text-2xl md:text-4xl font-serif font-bold tracking-wide mb-6 text-brand-dark" style={{ color: colors.primary }}>
                                        “Habitarte también es una forma de florecer”
                                    </h1>
                                    <p className="max-w-2xl mb-16 text-lg md:text-xl text-brand-dark/80 leading-relaxed font-light">
                                        Un espacio dedicado al bienestar emocional, la creatividad y la conexión humana, floreciendo desde el interior.
                                    </p>
                                    
                                    <div className="flex flex-wrap justify-center gap-6 w-full max-w-6xl">
                                        <div onClick={() => setActiveSection('indicadores')} className="w-full sm:w-[45%] lg:w-[30%] cursor-pointer p-8 rounded-[2rem] bg-white/60 backdrop-blur-lg border border-white/50 shadow-glass hover:shadow-lg hover:bg-white/80 transition-all text-center group">
                                            <Thumbnail 
                                                src="./indicadores-emocionales.jpeg" 
                                                alt="Indicadores" 
                                                className="w-32 h-32 mx-auto mb-6 rounded-full object-cover shadow-sm transition-transform duration-500 group-hover:scale-105 border-4 border-white"
                                                fallback={<div className="w-32 h-32 mx-auto mb-6 rounded-full bg-white flex items-center justify-center border-4 border-white shadow-sm"><Activity size={48} className="text-brand-purple" /></div>}
                                            />
                                            <h3 className="font-serif font-bold text-xl text-stone-800">Indicadores</h3>
                                        </div>
                                        <div onClick={() => setActiveSection('balance')} className="w-full sm:w-[45%] lg:w-[30%] cursor-pointer p-8 rounded-[2rem] bg-white/60 backdrop-blur-lg border border-white/50 shadow-glass hover:shadow-lg hover:bg-white/80 transition-all text-center group">
                                            <Thumbnail 
                                                src="./balance-cotidiano.jpeg" 
                                                alt="Balance" 
                                                className="w-32 h-32 mx-auto mb-6 rounded-full object-cover shadow-sm transition-transform duration-500 group-hover:scale-105 border-4 border-white"
                                                fallback={<div className="w-32 h-32 mx-auto mb-6 rounded-full bg-white flex items-center justify-center border-4 border-white shadow-sm"><Sun size={48} className="text-blue-400" /></div>}
                                            />
                                            <h3 className="font-serif font-bold text-xl text-stone-800">Balance Cotidiano</h3>
                                        </div>
                                        <div onClick={() => setActiveSection('library')} className="w-full sm:w-[45%] lg:w-[30%] cursor-pointer p-8 rounded-[2rem] bg-white/60 backdrop-blur-lg border border-white/50 shadow-glass hover:shadow-lg hover:bg-white/80 transition-all text-center group">
                                            <Thumbnail 
                                                src="./bloom-library.jpeg" 
                                                alt="Library" 
                                                className="w-32 h-32 mx-auto mb-6 rounded-full object-cover shadow-sm transition-transform duration-500 group-hover:scale-105 border-4 border-white"
                                                fallback={<div className="w-32 h-32 mx-auto mb-6 rounded-full bg-white flex items-center justify-center border-4 border-white shadow-sm"><Library size={48} className="text-brand-lilac" /></div>}
                                            />
                                            <h3 className="font-serif font-bold text-xl text-stone-800">Bloom Library</h3>
                                        </div>
                                        <div onClick={() => setActiveSection('capsulas')} className="w-full sm:w-[45%] lg:w-[30%] cursor-pointer p-8 rounded-[2rem] bg-white/60 backdrop-blur-lg border border-white/50 shadow-glass hover:shadow-lg hover:bg-white/80 transition-all text-center group">
                                            <Thumbnail 
                                                src="./capsulas-en-video.jpeg" 
                                                alt="Cápsulas" 
                                                className="w-32 h-32 mx-auto mb-6 rounded-full object-cover shadow-sm transition-transform duration-500 group-hover:scale-105 border-4 border-white"
                                                fallback={<div className="w-32 h-32 mx-auto mb-6 rounded-full bg-white flex items-center justify-center border-4 border-white shadow-sm"><PlayCircle size={48} className="text-orange-400" /></div>}
                                            />
                                            <h3 className="font-serif font-bold text-xl text-stone-800">Cápsulas en Video</h3>
                                        </div>
                                        <div onClick={() => setActiveSection('citas')} className="w-full sm:w-[45%] lg:w-[30%] cursor-pointer p-8 rounded-[2rem] bg-white/60 backdrop-blur-lg border border-white/50 shadow-glass hover:shadow-lg hover:bg-white/80 transition-all text-center group">
                                            <Thumbnail 
                                                src="./conoce-y-agenda.jpeg" 
                                                alt="Agenda" 
                                                className="w-32 h-32 mx-auto mb-6 rounded-full object-cover shadow-sm transition-transform duration-500 group-hover:scale-105 border-4 border-white"
                                                fallback={<div className="w-32 h-32 mx-auto mb-6 rounded-full bg-white flex items-center justify-center border-4 border-white shadow-sm"><Calendar size={48} className="text-brand-green" /></div>}
                                            />
                                            <h3 className="font-serif font-bold text-xl text-stone-800">Conoce y Agenda</h3>
                                        </div>
                                    </div>
                                </div>
                            );

                        case 'indicadores':
                            if (subView) {
                                const infoData = appData.indicadores?.informacion?.find(d => d.id === subView);
                                if (infoData) {
                                    return (
                                        <div className="animate-fadeIn bg-white/80 backdrop-blur-xl p-8 lg:p-14 rounded-[2.5rem] shadow-glass border border-white max-w-4xl mx-auto">
                                            <BackButton onClick={() => setSubView(null)} text="Volver a Información" />
                                            
                                            {infoData.imagen && (
                                                <div className="mb-12 w-full flex justify-center bg-white rounded-3xl p-4 sm:p-6 border border-stone-100 shadow-sm">
                                                    <img src={infoData.imagen} alt={infoData.title} className="max-w-full rounded-2xl object-contain max-h-[60vh]" />
                                                </div>
                                            )}

                                            <div className="flex items-center gap-5 mb-10 border-b border-stone-200/50 pb-8">
                                                <div className="p-4 rounded-full text-white shadow-md" style={{ backgroundColor: infoData.color }}>
                                                    {getIconComponent(infoData.icon, {size: 32})}
                                                </div>
                                                <h2 className="text-4xl lg:text-5xl font-serif font-bold text-stone-800" style={{ color: colors.primary }}>{infoData.title}</h2>
                                            </div>

                                            <div className="space-y-6 text-lg text-stone-700 leading-relaxed font-light text-justify">
                                                {infoData.contenido.map((parrafo, idx) => {
                                                    // Detectar si el párrafo inicia con un subtítulo
                                                    if(parrafo.includes(':') && parrafo.split(':')[0].length < 50) {
                                                        const parts = parrafo.split(':');
                                                        return <p key={idx}><strong className="text-stone-800">{parts[0]}:</strong>{parts.slice(1).join(':')}</p>;
                                                    }
                                                    return <p key={idx}>{parrafo}</p>;
                                                })}
                                            </div>
                                        </div>
                                    );
                                }
                                
                                const testData = appData.indicadores?.cuestionarios?.find(d => d.id === subView);
                                if (testData) {
                                    return <CuestionarioView data={testData} onBack={() => setSubView(null)} />;
                                }
                            }

                            return (
                                <div className="animate-fadeIn max-w-6xl mx-auto space-y-12">
                                    <div className="w-full">
                                        <BackButton onClick={() => setActiveSection('home')} text="Volver al Inicio" />
                                    </div>
                                    <div className="text-center mb-10">
                                        <h2 className="text-5xl font-serif font-bold mb-6 text-stone-800" style={{ color: colors.primary }}>Indicadores Emocionales</h2>
                                        <p className="text-stone-600 max-w-2xl mx-auto text-xl font-light">Infórmate sobre tu salud emocional y realiza ejercicios de autoexploración para identificar lo que estás sintiendo.</p>
                                    </div>

                                    <div className="flex justify-center flex-wrap gap-2 sm:gap-4 bg-white/50 backdrop-blur-md p-2 rounded-full shadow-glass border border-white w-fit mx-auto">
                                        <button 
                                            onClick={() => setIndicadoresTab('info')} 
                                            className={`px-8 py-3 rounded-full font-bold transition-all text-lg ${indicadoresTab === 'info' ? 'bg-white shadow-sm text-brand-purple' : 'text-stone-500 hover:text-stone-800 hover:bg-white/40'}`}
                                            >
                                            Información y Lectura
                                        </button>
                                        <button 
                                            onClick={() => setIndicadoresTab('tests')} 
                                            className={`px-8 py-3 rounded-full font-bold transition-all text-lg ${indicadoresTab === 'tests' ? 'bg-white shadow-sm text-brand-purple' : 'text-stone-500 hover:text-stone-800 hover:bg-white/40'}`}
                                            >
                                            Cuestionarios
                                        </button>
                                    </div>

                                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 pt-6">
                                        {indicadoresTab === 'info' && appData.indicadores?.informacion?.map(item => (
                                            <div key={item.id} onClick={() => setSubView(item.id)} className="cursor-pointer bg-white/70 backdrop-blur-lg p-8 rounded-[2rem] shadow-glass border border-white hover:shadow-lg transition-all group flex flex-col hover:-translate-y-1">
                                                <Thumbnail 
                                                    src={item.imagen} 
                                                    alt={item.title} 
                                                    className="w-20 h-20 rounded-2xl object-cover mb-6 shadow-sm group-hover:scale-105 transition-transform border-2 border-white"
                                                    fallback={
                                                        <div className="w-16 h-16 rounded-2xl flex items-center justify-center mb-6 group-hover:scale-105 transition-transform text-white shadow-sm" style={{ backgroundColor: item.color }}>
                                                            {getIconComponent(item.icon)}
                                                        </div>
                                                    }
                                                />
                                                <h3 className="text-2xl font-serif font-bold mb-3 text-stone-800 group-hover:text-brand-purple transition-colors">{item.title}</h3>
                                                <p className="text-[15px] text-stone-500 line-clamp-3 flex-grow leading-relaxed font-light">{item.contenido[0]}</p>
                                                <p className="text-sm font-bold text-brand-purple mt-6 tracking-wider uppercase">Leer artículo &rarr;</p>
                                            </div>
                                        ))}
                                        
                                        {indicadoresTab === 'tests' && appData.indicadores?.cuestionarios?.map(item => (
                                            <div key={item.id} onClick={() => setSubView(item.id)} className="cursor-pointer bg-white/70 backdrop-blur-lg p-8 rounded-[2rem] shadow-glass border border-white hover:shadow-lg transition-all group flex flex-col hover:-translate-y-1">
                                                <div className="w-16 h-16 rounded-2xl flex items-center justify-center mb-6 group-hover:scale-105 transition-transform text-white shadow-sm" style={{ backgroundColor: item.color }}>
                                                    {getIconComponent(item.icon)}
                                                </div>
                                                <h3 className="text-2xl font-serif font-bold mb-3 text-stone-800 group-hover:text-blue-500 transition-colors">{item.title}</h3>
                                                <p className="text-[15px] text-stone-500 line-clamp-3 flex-grow leading-relaxed font-light">{item.intro}</p>
                                                <p className="text-sm font-bold text-blue-500 mt-6 tracking-wider uppercase">Comenzar Test &rarr;</p>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            );

                        case 'balance':
                            const balanceData = appData.balance;
                            return (
                                <div className="animate-fadeIn max-w-4xl mx-auto space-y-8">
                                    <div className="w-full">
                                        <BackButton onClick={() => setActiveSection('home')} text="Volver al Inicio" />
                                    </div>
                                    <div className="bg-white/80 backdrop-blur-xl p-8 lg:p-14 rounded-[2.5rem] shadow-glass border border-white">
                                        
                                        {balanceData.imagen && (
                                            <div className="mb-12 w-full flex justify-center bg-white rounded-3xl p-4 sm:p-6 border border-stone-100 shadow-sm">
                                                <img src={balanceData.imagen} alt="Hábitos Sanos" className="max-w-full rounded-2xl object-contain max-h-[70vh]" />
                                            </div>
                                        )}

                                        <div className="flex items-center gap-5 mb-10 border-b border-stone-200/50 pb-8">
                                            <div className="p-4 rounded-full text-white shadow-md bg-blue-400">
                                                {getIconComponent(balanceData.icon, {size: 32})}
                                            </div>
                                            <h2 className="text-4xl lg:text-5xl font-serif font-bold text-stone-800">{balanceData.title}</h2>
                                        </div>

                                        <div className="space-y-6 text-lg text-stone-700 leading-relaxed font-light text-justify">
                                            {balanceData.contenido.map((parrafo, idx) => (
                                                <p key={idx}>{parrafo}</p>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            );

                        case 'library':
                            if (subView) {
                                const data = appData.cuentos.find(d => d.id === subView);
                                return (
                                    <div className="animate-fadeIn bg-white/80 backdrop-blur-xl p-8 lg:p-14 rounded-[2.5rem] shadow-glass border border-white max-w-4xl mx-auto">
                                        <BackButton onClick={() => setSubView(null)} text="Volver a Bloom Library" />
                                        
                                        {/* IMÁGENES DE CUENTOS COMPLETAS */}
                                        {data.imagen && (
                                            <div className="mb-12 w-full flex justify-center bg-white rounded-3xl p-4 sm:p-6 border border-stone-100 shadow-sm">
                                                <img src={data.imagen} alt={data.title} className="max-w-full h-auto rounded-2xl object-contain max-h-[85vh]" />
                                            </div>
                                        )}

                                        <div className="flex items-center gap-5 mb-10 border-b border-stone-200/50 pb-8">
                                            <div className="p-4 rounded-full text-white shadow-md bg-brand-lilac">
                                                <BookHeart size={32} />
                                            </div>
                                            <h2 className="text-4xl lg:text-5xl font-serif font-bold text-stone-800">{data.title}</h2>
                                        </div>
                                        <div className="space-y-6 text-lg text-stone-700 leading-relaxed font-serif text-justify">
                                            {data.contenido.map((parrafo, idx) => (
                                                <p key={idx}>{parrafo}</p>
                                            ))}
                                        </div>
                                    </div>
                                );
                            }

                            const categorias = [
                                { id: 'ninos', title: 'Para Niños', desc: 'Historias llenas de imaginación para descubrir emociones, valores y aprender a gestionarlos.' },
                                { id: 'adolescentes', title: 'Para Adolescentes', desc: 'Relatos sobre la identidad, los cambios, la presión social y el mundo interior en crecimiento.' },
                                { id: 'adultos', title: 'Para Adultos', desc: 'Reflexiones profundas sobre la sanación, los vínculos, las heridas del pasado y el reencuentro personal.' }
                            ];

                            return (
                                <div className="animate-fadeIn max-w-5xl mx-auto">
                                    <div className="w-full mb-6">
                                        <BackButton onClick={() => setActiveSection('home')} text="Volver al Inicio" />
                                    </div>
                                    <div className="text-center mb-12">
                                        <h2 className="text-5xl font-serif font-bold mb-6 text-stone-800">Bloom Library</h2>
                                        <p className="text-stone-600 max-w-2xl mx-auto text-xl font-light">Un espacio para nutrir tu mente y alma a través de recursos, recomendaciones y cuentos terapéuticos.</p>
                                    </div>

                                    <div className="bg-white/60 backdrop-blur-md p-8 lg:p-12 rounded-[2.5rem] border border-white mb-16 shadow-glass">
                                        <h3 className="text-3xl font-serif font-bold mb-8 text-brand-purple flex items-center gap-4">
                                            <Library className="text-brand-purple" size={32} />
                                            Recursos y Recomendaciones
                                        </h3>
                                        <div className="space-y-5 text-stone-700 leading-relaxed font-light text-lg">
                                            {appData.bloom_library.intro_text.map((parrafo, i) => (
                                                <p key={i}>{parrafo}</p>
                                            ))}
                                        </div>
                                    </div>

                                    <div className="space-y-16">
                                        <h3 className="text-4xl font-serif font-bold text-center mb-12 text-stone-800">Cuentos para el Alma</h3>
                                        {categorias.map(cat => {
                                            const cuentosCat = appData.cuentos.filter(c => c.categoria === cat.id);
                                            if (cuentosCat.length === 0) return null;
                                            
                                            return (
                                                <div key={cat.id} className="bg-transparent">
                                                    <h3 className="text-2xl font-serif font-bold mb-3 text-stone-800 border-b border-stone-200 pb-4">{cat.title}</h3>
                                                    <p className="text-stone-500 mb-8 mt-4 font-light text-lg">{cat.desc}</p>
                                                    <div className="grid md:grid-cols-2 gap-6">
                                                        {cuentosCat.map(cuento => (
                                                            <div key={cuento.id} onClick={() => setSubView(cuento.id)} className="cursor-pointer group flex items-center justify-between p-6 rounded-[2rem] bg-white/70 backdrop-blur-sm border border-white hover:border-brand-lilac hover:bg-white/90 transition-all shadow-glass hover:shadow-lg hover:-translate-y-1">
                                                                <div className="flex items-center gap-5">
                                                                    <Thumbnail 
                                                                        src={cuento.imagen} 
                                                                        alt={cuento.title} 
                                                                        className="w-20 h-20 rounded-2xl object-cover shadow-sm group-hover:scale-105 transition-transform shrink-0 border-2 border-white"
                                                                        fallback={
                                                                            <div className="w-20 h-20 rounded-2xl bg-brand-lilac/20 text-brand-purple flex items-center justify-center group-hover:scale-105 transition-transform shrink-0 border-2 border-white">
                                                                                <BookHeart size={32} />
                                                                            </div>
                                                                        }
                                                                    />
                                                                    <h4 className="font-serif font-bold text-xl text-stone-800 group-hover:text-brand-purple transition-colors">{cuento.title}</h4>
                                                                </div>
                                                                <span className="text-brand-lilac opacity-0 group-hover:opacity-100 transition-opacity font-bold text-xl">&rarr;</span>
                                                            </div>
                                                        ))}
                                                    </div>
                                                </div>
                                            )
                                        })}
                                    </div>
                                </div>
                            );

                        case 'capsulas':
                            return (
                                <div className="animate-fadeIn max-w-4xl mx-auto py-12">
                                    <div className="w-full mb-6">
                                        <BackButton onClick={() => setActiveSection('home')} text="Volver al Inicio" />
                                    </div>
                                    <div className="text-center">
                                        <h2 className="text-5xl font-serif font-bold mb-6 text-orange-400">Cápsulas en Video</h2>
                                        <p className="text-stone-600 mb-12 text-xl font-light">Espacio reservado para próximas reflexiones y guías audiovisuales de Neuro Bloom.</p>
                                        <div className="p-20 bg-white/70 backdrop-blur-xl rounded-[3rem] border border-white shadow-glass flex flex-col items-center justify-center">
                                            <PlayCircle size={100} className="text-orange-200 mb-8 animate-pulse" />
                                            <h3 className="text-3xl font-serif font-bold text-stone-500 mb-4">Próximamente</h3>
                                            <p className="text-stone-500 max-w-md mx-auto text-lg font-light">Estamos preparando el contenido en video para acompañar tu proceso de bienestar emocional.</p>
                                        </div>
                                    </div>
                                </div>
                            );

                        case 'citas':
                            return (
                                <div className="animate-fadeIn max-w-5xl mx-auto space-y-12">
                                    <div className="w-full">
                                        <BackButton onClick={() => setActiveSection('home')} text="Volver al Inicio" />
                                    </div>
                                    <div className="text-center mb-16">
                                        <h2 className="text-5xl font-serif font-bold mb-6 text-stone-800">Conoce y Agenda Cita</h2>
                                        <p className="text-stone-600 max-w-2xl mx-auto text-xl font-light">Inicia tu proceso de bienestar emocional. Conoce a nuestros especialistas y reserva tu espacio seguro con nosotros.</p>
                                    </div>

                                    <div className="grid md:grid-cols-2 gap-10">
                                        {appData.especialistas?.map(esp => (
                                            <div key={esp.id} className="bg-white/80 backdrop-blur-xl rounded-[2.5rem] shadow-glass border border-white overflow-hidden flex flex-col hover:shadow-xl transition-all group">
                                                <div className="w-full h-80 bg-stone-50 overflow-hidden relative border-b border-white">
                                                    <Thumbnail 
                                                        src={esp.imagen} 
                                                        alt={esp.nombre} 
                                                        className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-700"
                                                        fallback={<Activity size={80} className="text-stone-300 absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2" />}
                                                    />
                                                </div>
                                                <div className="p-10 flex flex-col flex-grow">
                                                    <h3 className="text-3xl font-serif font-bold text-stone-800 mb-2">{esp.nombre}</h3>
                                                    <p className="text-brand-green font-bold text-lg mb-3">{esp.titulo}</p>
                                                    {esp.cedula && <p className="text-sm text-stone-400 mb-5 font-mono">Cédula: {esp.cedula}</p>}
                                                    <p className="text-stone-600 text-[15px] mb-8 italic font-light leading-relaxed">{esp.descripcion}</p>
                                                    
                                                    <div className="mb-10 flex-grow">
                                                        <h4 className="font-bold text-sm text-stone-800 mb-4 uppercase tracking-widest border-b border-stone-200 pb-2">Especialidades y Enfoque</h4>
                                                        <ul className="space-y-3">
                                                            {esp.enfoques.map((enfoque, i) => (
                                                                <li key={i} className="text-[15px] text-stone-600 flex items-start gap-3 font-light">
                                                                    <span className="text-brand-green mt-1"><Heart size={16} fill="currentColor" /></span>
                                                                    <span className="leading-tight">{enfoque}</span>
                                                                </li>
                                                            ))}
                                                        </ul>
                                                    </div>
                                                    
                                                    <button className="w-full py-4 rounded-full text-white font-bold text-lg shadow-md hover:-translate-y-1 hover:shadow-lg transition-all flex justify-center items-center gap-3 bg-brand-green">
                                                        <Calendar size={20} />
                                                        Agendar Cita
                                                    </button>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            );

                        default:
                            return null;
                    }
                };

                return (
                    <div className="min-h-screen font-sans relative overflow-hidden text-stone-700">
                        {/* Background Blobs (Efecto Acuarela) */}
                        <div className="fixed inset-0 z-[-1] overflow-hidden bg-[#faf8f9]">
                            <div className="absolute top-[-10%] left-[-10%] w-[40rem] h-[40rem] bg-[#f8e4e9] rounded-full mix-blend-multiply filter blur-3xl opacity-70 animate-blob"></div>
                            <div className="absolute top-[10%] right-[-10%] w-[35rem] h-[35rem] bg-[#e6dcf0] rounded-full mix-blend-multiply filter blur-3xl opacity-70 animate-blob animation-delay-2000"></div>
                            <div className="absolute bottom-[-10%] left-[10%] w-[40rem] h-[40rem] bg-[#eaf4fc] rounded-full mix-blend-multiply filter blur-3xl opacity-70 animate-blob animation-delay-4000"></div>
                        </div>

                        <header className="sticky top-0 z-50 border-b border-white/40 bg-white/60 backdrop-blur-xl shadow-sm">
                            <div className="max-w-7xl mx-auto px-6 h-24 flex items-center justify-between">
                                <div className="cursor-pointer hover:opacity-80 transition-opacity h-full py-3" onClick={() => setActiveSection('home')}>
                                    <Logo className="h-full" />
                                </div>

                                <nav className="hidden lg:flex gap-2">
                                    <NavButton active={activeSection === 'home'} onClick={() => setActiveSection('home')} icon={<Heart />}>Inicio</NavButton>
                                    <NavButton active={activeSection === 'indicadores'} onClick={() => setActiveSection('indicadores')} icon={<Activity />}>Indicadores</NavButton>
                                    <NavButton active={activeSection === 'balance'} onClick={() => setActiveSection('balance')} icon={<Sun />}>Balance</NavButton>
                                    <NavButton active={activeSection === 'library'} onClick={() => setActiveSection('library')} icon={<Library />}>Library</NavButton>
                                    <NavButton active={activeSection === 'capsulas'} onClick={() => setActiveSection('capsulas')} icon={<PlayCircle />}>Cápsulas</NavButton>
                                    <NavButton active={activeSection === 'citas'} onClick={() => setActiveSection('citas')} icon={<Calendar />}>Agenda</NavButton>
                                </nav>

                                <button className="lg:hidden p-2 text-brand-purple" onClick={() => setMobileMenuOpen(!mobileMenuOpen)}>
                                    {mobileMenuOpen ? <X size={32} /> : <Menu size={32} />}
                                </button>
                            </div>
                        </header>

                        {mobileMenuOpen && (
                            <div className="fixed inset-0 z-40 pt-28 px-6 lg:hidden animate-slideIn bg-white/95 backdrop-blur-3xl">
                                <div className="flex flex-col gap-4">
                                    {['home', 'indicadores', 'balance', 'library', 'capsulas', 'citas'].map(sec => (
                                        <button 
                                            key={sec}
                                            onClick={() => { setActiveSection(sec); setMobileMenuOpen(false); }}
                                            className="text-left p-5 rounded-2xl font-bold text-xl border border-white/50 shadow-sm"
                                            style={{ 
                                                color: activeSection === sec ? colors.white : colors.primary,
                                                backgroundColor: activeSection === sec ? colors.primary : 'rgba(255,255,255,0.8)'
                                            }}
                                        >
                                            {sec === 'library' ? 'Bloom Library' : sec.charAt(0).toUpperCase() + sec.slice(1)}
                                        </button>
                                    ))}
                                </div>
                            </div>
                        )}

                        <main className="max-w-7xl mx-auto px-6 py-12 min-h-[80vh]">
                            {renderContent()}
                        </main>

                        <footer className="py-16 mt-12 bg-stone-900/95 backdrop-blur-md text-stone-400 flex flex-col items-center justify-center text-center">
                            <img 
                                src={logoUrl} 
                                alt="Neuro Bloom Logo Blanco" 
                                className="h-16 w-auto mb-6 opacity-50 brightness-0 invert" 
                            />
                            <p className="font-light tracking-wide">© {new Date().getFullYear()} Neuro Bloom. Creciendo con cada emoción.</p>
                        </footer>
                    </div>
                );
            }

            const root = ReactDOM.createRoot(document.getElementById('root'));
            root.render(<NeuroBloom />);
        } catch (error) {
            console.error(error);
            document.body.innerHTML = '<div class="error-container"><h3 class="error-title">Error Crítico</h3><p>' + error.message + '</p></div>';
        }
    </script>
</body>
</html>
