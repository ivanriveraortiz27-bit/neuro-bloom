<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neuro Bloom - Creciendo con cada emoción</title>
    
    <link rel="icon" href="https://i.ibb.co/WWs5xcSX/Neuro-Bloom-Logo-nbg.png" type="image/png">
    <link rel="stylesheet" href="styles.css">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.23.6/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <!-- Configuración personalizada de Tailwind -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Nunito', 'sans-serif'],
                        serif: ['Lora', 'serif'],
                    },
                    colors: {
                        brand: {
                            purple: '#81638b',
                            lilac: '#b695c0',
                            green: '#9BC496',
                            blue: '#81c9fa',
                            dark: '#4a444d'
                        }
                    },
                    boxShadow: {
                        'glass': '0 8px 32px 0 rgba(129, 99, 139, 0.05)',
                    }
                }
            }
        }
    </script>
</head>
<body>
    <div id="root">
        <div class="loading-screen">
            <h2 class="loading-title">Cargando Neuro Bloom...</h2>
            <p>Si este mensaje no desaparece en unos segundos, revisa tu conexión a internet.</p>
        </div>
    </div>

    <script>
        window.onerror = function(message, source, lineno, colno, error) {
            const root = document.getElementById('root');
            root.innerHTML = `
                <div class="error-container">
                    <h3 class="error-title">⚠️ Ocurrió un error al cargar</h3>
                    <p><strong>Mensaje:</strong> ${message}</p>
                    <p><strong>Línea:</strong> ${lineno}</p>
                    <p>Por favor, verifica que tienes conexión a internet.</p>
                </div>
            `;
            console.error(error);
        };
    </script>

    <script type="text/babel">
        try {
            // Inicialización de Firebase
            const firebaseConfig = {
                apiKey: "AIzaSyDDrImW6-xUfu5TdamXe0HH0eawlME-yZI",
                authDomain: "neuro-bloom-5313d.firebaseapp.com",
                projectId: "neuro-bloom-5313d",
                storageBucket: "neuro-bloom-5313d.firebasestorage.app",
                messagingSenderId: "727914123954",
                appId: "1:727914123954:web:2b4e961315b999647f6fab"
            };
            
            if (!firebase.apps.length) {
                firebase.initializeApp(firebaseConfig);
            }
            const auth = firebase.auth();
            const db = firebase.firestore();

            const { useState, useEffect, useRef } = React;

            // --- Iconos Globales ---
            const IconWrapper = ({ name, size = 24, className, color, fill = "none", ...props }) => {
                const iconRef = useRef(null);
                useEffect(() => {
                    if (window.lucide) {
                        window.lucide.createIcons({
                            root: iconRef.current,
                            nameAttr: 'data-lucide',
                            attrs: { width: size, height: size, stroke: color || 'currentColor', fill: fill, class: className, ...props }
                        });
                    }
                }, [name, size, className, color, fill]);
                return <i ref={iconRef} data-lucide={name} style={{ display: 'inline-flex' }}></i>;
            };

            const Heart = (props) => <IconWrapper name="heart" {...props} />;
            const Activity = (props) => <IconWrapper name="activity" {...props} />;
            const HeartHandshake = (props) => <IconWrapper name="heart-handshake" {...props} />;
            const Sun = (props) => <IconWrapper name="sun" {...props} />;
            const Calendar = (props) => <IconWrapper name="calendar" {...props} />;
            const Menu = (props) => <IconWrapper name="menu" {...props} />;
            const X = (props) => <IconWrapper name="x" {...props} />;
            const ArrowLeft = (props) => <IconWrapper name="arrow-left" {...props} />;
            const Shield = (props) => <IconWrapper name="shield" {...props} />;
            const Brain = (props) => <IconWrapper name="brain" {...props} />;
            const BookHeart = (props) => <IconWrapper name="book-heart" {...props} />;
            const PlayCircle = (props) => <IconWrapper name="play-circle" {...props} />;
            const Library = (props) => <IconWrapper name="library" {...props} />;
            const Sprout = (props) => <IconWrapper name="sprout" {...props} />;
            const Star = (props) => <IconWrapper name="star" {...props} />;
            const UserCircle = (props) => <IconWrapper name="user-circle" {...props} />;
            const Loader = (props) => <IconWrapper name="loader" {...props} className="animate-spin" />;

            const getIconComponent = (name, props = {}) => {
                switch(name) {
                    case 'activity': return <Activity {...props} />;
                    case 'heart': return <Heart {...props} />;
                    case 'heart-handshake': return <HeartHandshake {...props} />;
                    case 'sun': return <Sun {...props} />;
                    case 'shield': return <Shield {...props} />;
                    case 'brain': return <Brain {...props} />;
                    case 'book-heart': return <BookHeart {...props} />;
                    case 'play-circle': return <PlayCircle {...props} />;
                    case 'library': return <Library {...props} />;
                    case 'sprout': return <Sprout {...props} />;
                    case 'star': return <Star {...props} />;
                    default: return <Activity {...props} />;
                }
            };

            const Thumbnail = ({ src, alt, fallback, className }) => {
                const [error, setError] = useState(false);
                if (error || !src) {
                    return fallback;
                }
                return <img src={src} alt={alt} onError={() => setError(true)} className={className} />;
            };

            const colors = {
                primary: '#81638b',
                secondary: '#b695c0',
                actionBlue: '#2196f3',
                brainGreen: '#9BC496',
                white: '#FFFFFF',
            };

            const logoUrl = "https://i.ibb.co/WWs5xcSX/Neuro-Bloom-Logo-nbg.png";

            const Logo = ({ className }) => (
                <div className={`flex items-center gap-3 ${className}`}>
                    <img src={logoUrl} alt="Neuro Bloom Logo" className="h-full w-auto object-contain drop-shadow-sm" />
                </div>
            );

            const NavButton = ({ active, onClick, children, icon }) => (
                <button
                    onClick={onClick}
                    className={`flex items-center gap-2 px-5 py-2 rounded-full transition-all duration-300 text-[15px] font-bold tracking-wide border ${
                        active 
                        ? 'bg-brand-purple/90 text-white border-brand-purple shadow-md transform scale-105' 
                        : 'bg-white/40 text-brand-purple border-white/60 hover:bg-white/70 hover:shadow-sm'
                    }`}
                >
                    {React.cloneElement(icon, { size: 18, color: active ? colors.white : colors.primary })}
                    <span className="hidden lg:inline">{children}</span>
                </button>
            );

            const BackButton = ({ onClick, text = "Volver" }) => (
                <button onClick={onClick} className="flex items-center gap-2 mb-8 text-stone-500 hover:text-brand-purple transition-colors font-bold group w-fit bg-white/60 backdrop-blur-sm px-4 py-2 rounded-full border border-white shadow-sm">
                    <ArrowLeft size={18} className="group-hover:-translate-x-1 transition-transform text-brand-purple" />
                    <span className="text-stone-600">{text}</span>
                </button>
            );

            // --- Componente de Cuestionario ---
            const CuestionarioView = ({ data, onBack }) => {
                const [respuestas, setRespuestas] = useState({});
                const [resultado, setResultado] = useState(null);

                const calcularPuntaje = () => {
                    const total = Object.values(respuestas).reduce((a, b) => a + b, 0);
                    setResultado(total);
                };

                const obtenerInterpretacion = (puntaje) => {
                    let textoResultado = "";
                    let advertenciaExtra = "";

                    if (data.id === 'depresion-test' && respuestas[12] >= 2) {
                        advertenciaExtra = "Importante: Si en la pregunta 13 respondiste 'Frecuentemente' o 'Casi todo el tiempo', es recomendable buscar apoyo profesional lo antes posible, incluso si tu puntaje total no es elevado.";
                    }

                    for (let int of data.interpretacion) {
                        const partes = int.rango.match(/(\d+)\s*[-–]\s*(\d+)/);
                        if (partes) {
                            const min = parseInt(partes[1], 10);
                            const max = parseInt(partes[2], 10);
                            if (puntaje >= min && puntaje <= max) {
                                textoResultado = int.texto;
                                break;
                            }
                        }
                    }

                    if (!textoResultado) textoResultado = "Te sugerimos buscar orientación profesional para analizar tus resultados a detalle.";

                    return (
                        <div className="space-y-4">
                            <p className="text-xl text-stone-700 font-medium leading-relaxed">{textoResultado}</p>
                            {advertenciaExtra && (
                                <div className="mt-4 p-4 bg-orange-100 border-l-4 border-orange-500 text-orange-800 rounded-lg text-left">
                                    <strong className="block mb-1 text-orange-900">Atención:</strong>
                                    {advertenciaExtra}
                                </div>
                            )}
                        </div>
                    );
                };

                return (
                    <div className="animate-fadeIn bg-white/70 backdrop-blur-xl p-8 lg:p-12 rounded-[2rem] shadow-glass border border-white/60 max-w-4xl mx-auto relative z-10">
                        <BackButton onClick={onBack} text="Volver a Cuestionarios" />
                        
                        <div className="flex items-center gap-4 mb-6">
                            <div className="p-3 rounded-full text-white shadow-md" style={{ backgroundColor: data.color || colors.primary }}>
                                {getIconComponent(data.icon)}
                            </div>
                            <h2 className="text-3xl lg:text-4xl font-serif font-bold text-stone-800" style={{ color: colors.primary }}>{data.title}</h2>
                        </div>
                        
                        {data.intro && <p className="text-lg text-stone-600 mb-8 leading-relaxed whitespace-pre-line">{data.intro}</p>}

                        <div className="space-y-6">
                            {data.preguntas.map((pregunta, idx) => (
                                <div key={idx} className="bg-white/80 p-6 rounded-2xl border border-white shadow-sm hover:shadow-md transition-shadow">
                                    <p className="font-semibold text-stone-800 mb-4 text-lg">{idx + 1}. {pregunta}</p>
                                    <div className="flex flex-wrap gap-3">
                                        {data.opciones.map((opc, oIdx) => (
                                            <button 
                                                key={oIdx}
                                                onClick={() => setRespuestas({...respuestas, [idx]: opc.v})}
                                                className={`px-5 py-2.5 rounded-full text-sm font-bold transition-all border ${
                                                    respuestas[idx] === opc.v 
                                                    ? 'bg-white shadow-md scale-105' 
                                                    : 'bg-stone-50/50 border-stone-200 hover:border-stone-300 text-stone-500 hover:bg-white'
                                                }`}
                                                style={{ 
                                                    borderColor: respuestas[idx] === opc.v ? (data.color || colors.primary) : '',
                                                    color: respuestas[idx] === opc.v ? (data.color || colors.primary) : '' 
                                                }}
                                            >
                                                {opc.l}
                                            </button>
                                        ))}
                                    </div>
                                </div>
                            ))}
                        </div>

                        <div className="mt-12 text-center">
                            <button 
                                onClick={calcularPuntaje}
                                disabled={Object.keys(respuestas).length < data.preguntas.length}
                                className="px-10 py-4 rounded-full text-white font-bold text-lg shadow-lg disabled:opacity-50 disabled:cursor-not-allowed transition-all hover:-translate-y-1"
                                style={{ backgroundColor: colors.primary }}
                            >
                                Ver Resultado
                            </button>
                            {Object.keys(respuestas).length < data.preguntas.length && (
                                <p className="text-stone-400 text-sm mt-3">Responde todas las preguntas para ver tu resultado.</p>
                            )}
                        </div>

                        {resultado !== null && (
                            <div className="mt-12 p-8 lg:p-10 rounded-3xl bg-indigo-50/80 backdrop-blur-sm border border-indigo-100 animate-slideIn text-center shadow-inner">
                                <h3 className="text-3xl font-serif font-bold mb-6" style={{ color: colors.primary }}>Tu puntuación total: {resultado}</h3>
                                <div className="mb-8 text-left max-w-2xl mx-auto p-6 bg-white/90 rounded-2xl border border-white shadow-sm">
                                    {obtenerInterpretacion(resultado)}
                                </div>
                                <div className="p-6 bg-white/60 rounded-3xl text-stone-600 text-sm shadow-sm border border-white text-left">
                                    <p className="font-bold mb-2">Recuerda:</p>
                                    <p>Reconocer cómo nos sentimos es el primer paso para cuidar nuestra salud mental. Pedir ayuda profesional también es una forma de autocuidado.</p>
                                    <p className="mt-2 italic">Este cuestionario no sustituye una evaluación clínica ni constituye un diagnóstico.</p>
                                </div>
                            </div>
                        )}
                    </div>
                );
            };

            // --- Componente Modal de Autenticación Mejorado ---
            const AuthModal = ({ onClose }) => {
                const [isLogin, setIsLogin] = useState(true);
                const [email, setEmail] = useState('');
                const [password, setPassword] = useState('');
                const [error, setError] = useState('');
                const [loading, setLoading] = useState(false);

                const handleSubmit = async (e) => {
                    e.preventDefault();
                    setLoading(true);
                    setError('');
                    
                    try {
                        if (isLogin) {
                            await auth.signInWithEmailAndPassword(email, password);
                        } else {
                            const userCredential = await auth.createUserWithEmailAndPassword(email, password);
                            // Crear documento en Firestore por defecto sin premium
                            await db.collection('users').doc(userCredential.user.uid).set({
                                email: userCredential.user.email,
                                isPremium: false,
                                createdAt: firebase.firestore.FieldValue.serverTimestamp()
                            });
                        }
                        onClose(); // Cerrar modal al tener éxito
                    } catch (err) {
                        // Traducir algunos errores comunes
                        let msg = err.message;
                        if (err.code === 'auth/invalid-credential' || err.code === 'auth/user-not-found' || err.code === 'auth/wrong-password') {
                            msg = 'Correo o contraseña incorrectos.';
                        } else if (err.code === 'auth/email-already-in-use') {
                            msg = 'Este correo ya está registrado.';
                        } else if (err.code === 'auth/weak-password') {
                            msg = 'La contraseña debe tener al menos 6 caracteres.';
                        }
                        setError(msg);
                    }
                    setLoading(false);
                };

                return (
                    <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-stone-900/40 backdrop-blur-sm animate-fadeIn">
                        <div className="bg-white/95 backdrop-blur-xl p-8 rounded-[2rem] shadow-2xl border border-white max-w-md w-full relative">
                            {/* Botón superior (X) más visible */}
                            <button 
                                onClick={onClose} 
                                className="absolute top-4 right-4 p-2 bg-stone-100/80 rounded-full text-stone-500 hover:bg-stone-200 hover:text-stone-800 transition-colors"
                                title="Cerrar ventana"
                            >
                                <X size={20} />
                            </button>
                            
                            <div className="text-center mb-8 mt-2">
                                <h3 className="text-3xl font-serif font-bold text-brand-purple mb-2">
                                    {isLogin ? 'Iniciar Sesión' : 'Crear Cuenta'}
                                </h3>
                                <p className="text-stone-500 font-light text-sm">
                                    {isLogin ? 'Ingresa a tu espacio en Neuro Bloom' : 'Comienza tu proceso con nosotros'}
                                </p>
                            </div>

                            <form onSubmit={handleSubmit} className="space-y-5">
                                <div>
                                    <label className="block text-sm font-bold text-stone-700 mb-1">Correo Electrónico</label>
                                    <input 
                                        type="email" 
                                        value={email}
                                        onChange={(e) => setEmail(e.target.value)}
                                        className="w-full px-4 py-3 rounded-xl border border-stone-200 focus:border-brand-purple focus:ring-2 focus:ring-brand-purple/20 outline-none transition-all bg-white/50"
                                        required 
                                    />
                                </div>
                                <div>
                                    <label className="block text-sm font-bold text-stone-700 mb-1">Contraseña</label>
                                    <input 
                                        type="password" 
                                        value={password}
                                        onChange={(e) => setPassword(e.target.value)}
                                        className="w-full px-4 py-3 rounded-xl border border-stone-200 focus:border-brand-purple focus:ring-2 focus:ring-brand-purple/20 outline-none transition-all bg-white/50"
                                        required 
                                    />
                                </div>

                                {error && <p className="text-red-500 text-sm font-bold text-center bg-red-50 p-2 rounded-lg">{error}</p>}

                                <button 
                                    type="submit" 
                                    disabled={loading}
                                    className="w-full py-4 mt-2 bg-brand-purple text-white rounded-xl font-bold shadow-md hover:shadow-lg transform hover:-translate-y-0.5 transition-all flex justify-center items-center gap-2 disabled:opacity-70 disabled:cursor-not-allowed"
                                >
                                    {loading ? <Loader size={20} /> : (isLogin ? 'Ingresar' : 'Registrarme')}
                                </button>
                            </form>

                            {/* Área inferior con enlace de cambio y botón explícito de Cerrar */}
                            <div className="mt-6 text-center border-t border-stone-100 pt-6 flex flex-col gap-4">
                                <p className="text-stone-500 text-sm">
                                    {isLogin ? '¿Aún no tienes cuenta?' : '¿Ya tienes cuenta?'}
                                    <button 
                                        onClick={() => {setIsLogin(!isLogin); setError('');}} 
                                        className="ml-2 text-brand-purple font-bold hover:underline"
                                    >
                                        {isLogin ? 'Regístrate aquí' : 'Inicia Sesión'}
                                    </button>
                                </p>
                                
                                <button 
                                    onClick={onClose} 
                                    className="text-stone-400 hover:text-stone-600 text-sm font-bold transition-colors w-fit mx-auto"
                                >
                                    Cerrar ventana
                                </button>
                            </div>
                        </div>
                    </div>
                );
            };

            // --- Componente Principal ---
            function NeuroBloom() {
                const [activeSection, setActiveSection] = useState('home');
                const [subView, setSubView] = useState(null);
                const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
                
                // Estados para Auth
                const [user, setUser] = useState(null);
                const [isPremium, setIsPremium] = useState(false);
                const [authLoading, setAuthLoading] = useState(true);
                const [showAuthModal, setShowAuthModal] = useState(false);

                // Estados para pestañas
                const [indicadoresTab, setIndicadoresTab] = useState('info'); 
                const [balanceTab, setBalanceTab] = useState('vida');
                const [retoTab, setRetoTab] = useState('intro');
                
                const [appData, setAppData] = useState(null);
                const [dataError, setDataError] = useState(false);

                // Escuchar estado de autenticación
                useEffect(() => {
                    const unsubscribe = auth.onAuthStateChanged(async (currentUser) => {
                        setUser(currentUser);
                        if (currentUser) {
                            // Buscar en base de datos si es Premium
                            try {
                                const doc = await db.collection('users').doc(currentUser.uid).get();
                                if (doc.exists) {
                                    setIsPremium(doc.data().isPremium === true);
                                } else {
                                    setIsPremium(false);
                                }
                            } catch (error) {
                                console.error("Error al leer datos de usuario:", error);
                                setIsPremium(false);
                            }
                        } else {
                            setIsPremium(false);
                        }
                        setAuthLoading(false);
                    });
                    return () => unsubscribe();
                }, []);

                useEffect(() => {
                    fetch('./data.json')
                        .then(res => {
                            if (!res.ok) throw new Error("No se pudo cargar data.json");
                            return res.json();
                        })
                        .then(data => setAppData(data))
                        .catch(err => {
                            console.error(err);
                            setDataError(true);
                        });
                }, []);

                useEffect(() => {
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                }, [activeSection, subView, balanceTab, retoTab]);

                useEffect(() => {
                    setSubView(null);
                }, [activeSection]); 

                // Lógica de Acceso Premium
                const handlePremiumClick = () => {
                    if (!user) {
                        // 1. Si no hay sesión, obligar a iniciar sesión/registro
                        setShowAuthModal(true);
                    } else if (!isPremium) {
                        // 2. Si tiene sesión pero NO es premium, mandarlo a pagar
                        alert('Redirigiendo a pasarela de pago (Stripe)...');
                        // window.open('STRIPE_LINK', '_blank');
                    } else {
                        // 3. Si tiene sesión y ES premium, acceder
                        setActiveSection('premium_view');
                    }
                };

                const handleLogout = async () => {
                    await auth.signOut();
                    setActiveSection('home');
                };

                if (dataError) {
                    return (
                        <div className="loading-screen bg-red-50 text-stone-800 p-8">
                            <h2 className="text-2xl text-red-600 font-bold mb-4 font-serif">Error al cargar datos</h2>
                            <p className="max-w-xl text-center mb-4">Revisa la consola o asegúrate de estar utilizando un Live Server local.</p>
                        </div>
                    );
                }

                if (!appData || authLoading) {
                    return (
                        <div className="loading-screen">
                            <h2 className="loading-title animate-pulse">Despertando Neuro Bloom...</h2>
                        </div>
                    );
                }

                const renderContent = () => {
                    switch (activeSection) {
                        case 'home':
                            return (
                                <div className="animate-fadeIn flex flex-col items-center justify-center text-center py-8 lg:py-16 relative z-10">
                                    <img src={logoUrl} alt="Neuro Bloom" className="w-full max-w-lg h-auto mx-auto drop-shadow-md mb-8" />
                                    
                                    <h1 className="text-2xl md:text-4xl font-serif font-bold tracking-wide mb-6 text-brand-dark" style={{ color: colors.primary }}>
                                        “Habitarte también es una forma de florecer”
                                    </h1>
                                    <p className="max-w-2xl mb-12 text-lg md:text-xl text-brand-dark/80 leading-relaxed font-light">
                                        Un espacio dedicado al bienestar emocional, la creatividad y la conexión humana, floreciendo desde el interior.
                                    </p>

                                    {/* Botón Bloom Premium Principal */}
                                    <div className="flex justify-center mb-16 w-full animate-bounce" style={{animationDuration: '3s'}}>
                                        <button 
                                            onClick={handlePremiumClick} 
                                            className="px-8 py-4 bg-gradient-to-r from-amber-400 to-yellow-500 text-white rounded-full font-bold text-xl shadow-lg hover:shadow-xl transform hover:-translate-y-1 transition-all flex items-center gap-3 border-2 border-yellow-300"
                                        >
                                            <Star size={28} fill="currentColor" />
                                            Bloom Premium
                                        </button>
                                    </div>
                                    
                                    <div className="flex flex-wrap justify-center gap-6 w-full max-w-6xl">
                                        <div onClick={() => setActiveSection('indicadores')} className="w-full sm:w-[45%] lg:w-[30%] cursor-pointer rounded-[2rem] shadow-lg hover:shadow-xl transition-all overflow-hidden group">
                                            <Thumbnail 
                                                src="./indicadores-emocionales.jpeg" 
                                                alt="Indicadores" 
                                                className="w-full h-auto block transition-transform duration-500 group-hover:scale-105"
                                                fallback={<div className="w-full py-16 bg-white/60 flex items-center justify-center"><Activity size={64} className="text-brand-purple" /></div>}
                                            />
                                        </div>
                                        <div onClick={() => setActiveSection('balance')} className="w-full sm:w-[45%] lg:w-[30%] cursor-pointer rounded-[2rem] shadow-lg hover:shadow-xl transition-all overflow-hidden group">
                                            <Thumbnail 
                                                src="./balance-cotidiano.jpeg" 
                                                alt="Balance" 
                                                className="w-full h-auto block transition-transform duration-500 group-hover:scale-105"

                                                        </ul>
                                                    </div>
                                                    
                                                    <button className="w-full py-4 rounded-full text-white font-bold text-lg shadow-md hover:-translate-y-1 hover:shadow-lg transition-all flex justify-center items-center gap-3 bg-brand-green">
                                                        <Calendar size={20} />
                                                        Agendar Cita
                                                    </button>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            );

                        default:
                            return null;
                    }
                };

                return (
                    <div className="min-h-screen font-sans relative overflow-hidden text-stone-700 bg-[#faf8f9]">
                        
                        {/* Renderizar Modal de Autenticación */}
                        {showAuthModal && <AuthModal onClose={() => setShowAuthModal(false)} />}

                        {/* 1. Fondo de Base */}
                        <div className="fixed inset-0 z-0 overflow-hidden pointer-events-none">
                            <div className="absolute top-[-15%] left-[-15%] w-[40rem] h-[40rem] bg-[#f2e6e9] rounded-full mix-blend-multiply filter blur-3xl opacity-60 animate-blob"></div>
                            <div className="absolute top-[10%] right-[-15%] w-[35rem] h-[35rem] bg-[#e3dbe8] rounded-full mix-blend-multiply filter blur-3xl opacity-60 animate-blob animation-delay-2000"></div>
                            <div className="absolute bottom-[-15%] left-[20%] w-[40rem] h-[40rem] bg-[#e1edf2] rounded-full mix-blend-multiply filter blur-3xl opacity-60 animate-blob animation-delay-4000"></div>
                        </div>

                        {/* 2. Capa de Decoración Orgánica: Tonos Mate */}
                        <div className="fixed inset-0 z-1 pointer-events-none overflow-hidden opacity-80">
                            <div className="absolute top-[8%] left-[2%] w-4 h-4 bg-[#C8B6D6]/70 rounded-full"></div>
                            <div className="absolute top-[22%] left-[5%] w-10 h-10 bg-[#AEC5B6]/40 rounded-full border-2 border-[#AEC5B6]/70"></div>
                            <div className="absolute top-[40%] left-[3%] w-5 h-5 bg-[#D9B4B8]/70 rounded-full"></div>
                            <div className="absolute top-[60%] left-[6%] w-14 h-14 bg-[#B2C2D1]/30 rounded-full border border-[#B2C2D1]/60"></div>
                            <div className="absolute bottom-[20%] left-[2%] w-7 h-7 bg-[#C8B6D6]/50 rounded-full"></div>
                            <div className="absolute bottom-[5%] left-[5%] w-3 h-3 bg-[#AEC5B6]/80 rounded-full"></div>

                            <div className="absolute top-[12%] right-[4%] w-8 h-8 bg-[#D9B4B8]/40 rounded-full border-2 border-[#D9B4B8]/70"></div>
                            <div className="absolute top-[30%] right-[2%] w-4 h-4 bg-[#B2C2D1]/70 rounded-full"></div>
                            <div className="absolute top-[48%] right-[5%] w-12 h-12 bg-[#C8B6D6]/40 rounded-[40%_60%_70%_30%/40%_50%_60%_50%] border border-[#C8B6D6]/70 rotate-12"></div>
                            <div className="absolute top-[68%] right-[3%] w-5 h-5 bg-[#AEC5B6]/60 rounded-full"></div>
                            <div className="absolute bottom-[25%] right-[6%] w-6 h-6 bg-[#D9B4B8]/50 rounded-full"></div>
                            <div className="absolute bottom-[8%] right-[2%] w-4 h-4 bg-[#C8B6D6]/80 rounded-full"></div>

                            <div className="absolute top-[15%] left-[-5%] w-56 h-56 bg-[#C8B6D6]/20 rounded-full filter blur-2xl animate-blob"></div>
                            <div className="absolute top-[50%] right-[-6%] w-64 h-64 bg-[#D9B4B8]/20 rounded-[50%_50%_70%_30%/40%_60%_40%_60%] filter blur-2xl animate-blob animation-delay-2000"></div>
                            <div className="absolute bottom-[10%] left-[-4%] w-48 h-48 bg-[#AEC5B6]/20 rounded-[60%_40%_50%_50%/30%_70%_30%_70%] filter blur-2xl animate-blob animation-delay-4000"></div>
                        </div>

                        {/* 3. Contenido Principal */}
                        <header className="sticky top-0 z-50 border-b border-white/40 bg-white/60 backdrop-blur-xl shadow-sm">
                            <div className="max-w-7xl mx-auto px-6 h-24 flex items-center justify-between">
                                <div className="cursor-pointer hover:opacity-80 transition-opacity h-full py-3" onClick={() => setActiveSection('home')}>
                                    <Logo className="h-full" />
                                </div>

                                <nav className="hidden lg:flex gap-2 relative z-50">
                                    <NavButton active={activeSection === 'home'} onClick={() => setActiveSection('home')} icon={<Heart />}>Inicio</NavButton>
                                    <NavButton active={activeSection === 'indicadores'} onClick={() => setActiveSection('indicadores')} icon={<Activity />}>Indicadores</NavButton>
                                    <NavButton active={activeSection === 'balance'} onClick={() => setActiveSection('balance')} icon={<Sun />}>Balance</NavButton>
                                    <NavButton active={activeSection === 'library'} onClick={() => setActiveSection('library')} icon={<Library />}>Library</NavButton>
                                    <NavButton active={activeSection === 'infancias'} onClick={() => setActiveSection('infancias')} icon={<Sprout />}>Infancias</NavButton>
                                    <NavButton active={activeSection === 'capsulas'} onClick={() => setActiveSection('capsulas')} icon={<PlayCircle />}>Cápsulas</NavButton>
                                    <NavButton active={activeSection === 'citas'} onClick={() => setActiveSection('citas')} icon={<Calendar />}>Agenda</NavButton>
                                </nav>

                                {/* Controles de Usuario (Cerrar / Iniciar Sesión) */}
                                <div className="flex items-center gap-4 relative z-50">
                                    {user ? (
                                        <button 
                                            onClick={handleLogout} 
                                            className="hidden sm:flex text-sm font-bold text-stone-500 hover:text-brand-purple transition-colors items-center gap-2"
                                        >
                                            <UserCircle size={20} />
                                            Cerrar Sesión
                                        </button>
                                    ) : (
                                        <button 
                                            onClick={() => setShowAuthModal(true)} 
                                            className="hidden sm:flex px-4 py-2 bg-white/50 border border-brand-purple/30 rounded-full text-sm font-bold text-brand-purple hover:bg-brand-purple hover:text-white transition-all items-center gap-2"
                                        >
                                            <UserCircle size={18} />
                                            Ingresar
                                        </button>
                                    )}

                                    <button className="lg:hidden p-2 text-brand-purple" onClick={() => setMobileMenuOpen(!mobileMenuOpen)}>
                                        {mobileMenuOpen ? <X size={32} /> : <Menu size={32} />}
                                    </button>
                                </div>
                            </div>
                        </header>

                        {mobileMenuOpen && (
                            <div className="fixed inset-0 z-40 pt-28 px-6 lg:hidden animate-slideIn bg-white/95 backdrop-blur-3xl">
                                <div className="flex flex-col gap-4">
                                    <div className="mb-4 pb-4 border-b border-stone-200">
                                        {user ? (
                                            <button onClick={() => {handleLogout(); setMobileMenuOpen(false);}} className="w-full text-left p-5 rounded-2xl font-bold text-xl text-stone-500 bg-stone-100 flex items-center gap-3">
                                                <UserCircle size={24} /> Cerrar Sesión
                                            </button>
                                        ) : (
                                            <button onClick={() => {setShowAuthModal(true); setMobileMenuOpen(false);}} className="w-full text-left p-5 rounded-2xl font-bold text-xl text-white bg-brand-purple shadow-md flex items-center gap-3">
                                                <UserCircle size={24} /> Iniciar Sesión / Registro
                                            </button>
                                        )}
                                    </div>
                                    {['home', 'indicadores', 'balance', 'library', 'infancias', 'capsulas', 'citas'].map(sec => (
                                        <button 
                                            key={sec}
                                            onClick={() => { setActiveSection(sec); setMobileMenuOpen(false); }}
                                            className="text-left p-5 rounded-2xl font-bold text-xl border border-white/50 shadow-sm"
                                            style={{ 
                                                color: activeSection === sec ? colors.white : colors.primary,
                                                backgroundColor: activeSection === sec ? colors.primary : 'rgba(255,255,255,0.8)'
                                            }}
                                        >
                                            {sec === 'library' ? 'Bloom Library' : sec === 'infancias' ? 'Infancias que Florecen' : sec === 'citas' ? 'Agenda' : sec.charAt(0).toUpperCase() + sec.slice(1)}
                                        </button>
                                    ))}
                                </div>
                            </div>
                        )}

                        <main className="max-w-7xl mx-auto px-6 py-12 min-h-[80vh] relative z-10">
                            {renderContent()}
                        </main>

                        <footer className="py-16 mt-12 bg-stone-900/95 backdrop-blur-md text-stone-400 flex flex-col items-center justify-center text-center relative z-10">
                            <img 
                                src={logoUrl} 
                                alt="Neuro Bloom Logo Blanco" 
                                className="h-16 w-auto mb-6 opacity-50 brightness-0 invert" 
                            />
                            <p className="font-light tracking-wide relative z-20">© {new Date().getFullYear()} Neuro Bloom. Creciendo con cada emoción.</p>
                        </footer>
                    </div>
                );
            }

            const root = ReactDOM.createRoot(document.getElementById('root'));
            root.render(<NeuroBloom />);
        } catch (error) {
            console.error(error);
            document.body.innerHTML = '<div class="error-container"><h3 class="error-title">Error Crítico</h3><p>' + error.message + '</p></div>';
        }
    </script>
</body>
</html>
