<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neuro Bloom - Creciendo con cada emoción</title>
    
    <link rel="icon" href="https://i.ibb.co/WWs5xcSX/Neuro-Bloom-Logo-nbg.png" type="image/png">
    <link rel="stylesheet" href="styles.css">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.23.6/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <!-- Configuración personalizada de Tailwind -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Nunito', 'sans-serif'],
                        serif: ['Lora', 'serif'],
                    },
                    colors: {
                        brand: {
                            purple: '#81638b',
                            lilac: '#b695c0',
                            green: '#9BC496',
                            blue: '#81c9fa',
                            dark: '#4a444d'
                        }
                    },
                    boxShadow: {
                        'glass': '0 8px 32px 0 rgba(129, 99, 139, 0.06)',
                        'premium': '0 15px 40px -10px rgba(251, 191, 36, 0.15)',
                    }
                }
            }
        }
    </script>
    <style>
        .animate-fadeIn { animation: fadeIn 0.5s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        body { background-color: #faf9fa; }
    </style>
</head>
<body>
    <div id="root">
        <div class="loading-screen text-center mt-20">
            <h2 class="text-2xl text-stone-600 font-serif">Cargando Neuro Bloom...</h2>
            <p class="text-stone-400 mt-4">Si este mensaje no desaparece, revisa tu conexión a internet.</p>
        </div>
    </div>

    <script type="text/babel">
        try {
            // Inicialización de Firebase
            const firebaseConfig = {
                apiKey: "AIzaSyDDrImW6-xUfu5TdamXe0HH0eawlME-yZI",
                authDomain: "neuro-bloom-5313d.firebaseapp.com",
                projectId: "neuro-bloom-5313d",
                storageBucket: "neuro-bloom-5313d.firebasestorage.app",
                messagingSenderId: "727914123954",
                appId: "1:727914123954:web:2b4e961315b999647f6fab"
            };
            
            if (!firebase.apps.length) {
                firebase.initializeApp(firebaseConfig);
            }
            const auth = firebase.auth();
            const db = firebase.firestore();

            const { useState, useEffect, useRef } = React;

            // --- Iconos Globales ---
            const IconWrapper = ({ name, size = 24, className, color, fill = "none", ...props }) => {
                const iconRef = useRef(null);
                useEffect(() => {
                    if (window.lucide) {
                        window.lucide.createIcons({
                            root: iconRef.current,
                            nameAttr: 'data-lucide',
                            attrs: { width: size, height: size, stroke: color || 'currentColor', fill: fill, class: className, ...props }
                        });
                    }
                }, [name, size, className, color, fill]);
                return <i ref={iconRef} data-lucide={name} style={{ display: 'inline-flex' }}></i>;
            };

            const Heart = (props) => <IconWrapper name="heart" {...props} />;
            const Activity = (props) => <IconWrapper name="activity" {...props} />;
            const HeartHandshake = (props) => <IconWrapper name="heart-handshake" {...props} />;
            const Sun = (props) => <IconWrapper name="sun" {...props} />;
            const Calendar = (props) => <IconWrapper name="calendar" {...props} />;
            const Menu = (props) => <IconWrapper name="menu" {...props} />;
            const X = (props) => <IconWrapper name="x" {...props} />;
            const ArrowLeft = (props) => <IconWrapper name="arrow-left" {...props} />;
            const Shield = (props) => <IconWrapper name="shield" {...props} />;
            const Brain = (props) => <IconWrapper name="brain" {...props} />;
            const BookHeart = (props) => <IconWrapper name="book-heart" {...props} />;
            const PlayCircle = (props) => <IconWrapper name="play-circle" {...props} />;
            const Library = (props) => <IconWrapper name="library" {...props} />;
            const Sprout = (props) => <IconWrapper name="sprout" {...props} />;
            const Star = (props) => <IconWrapper name="star" {...props} />;
            const UserCircle = (props) => <IconWrapper name="user-circle" {...props} />;
            const Loader = (props) => <IconWrapper name="loader" {...props} className="animate-spin" />;
            const Compass = (props) => <IconWrapper name="compass" {...props} />;
            const Lock = (props) => <IconWrapper name="lock" {...props} />;
            const CheckCircle = (props) => <IconWrapper name="check-circle" {...props} />;
            const MessageCircle = (props) => <IconWrapper name="message-circle" {...props} />;
            const PenTool = (props) => <IconWrapper name="pen-tool" {...props} />;
            const Headphones = (props) => <IconWrapper name="headphones" {...props} />;
            const FileText = (props) => <IconWrapper name="file-text" {...props} />;
            const Leaf = (props) => <IconWrapper name="leaf" {...props} />;

            const getIconComponent = (name, props = {}) => {
                switch(name) {
                    case 'activity': return <Activity {...props} />;
                    case 'heart': return <Heart {...props} />;
                    case 'heart-handshake': return <HeartHandshake {...props} />;
                    case 'sun': return <Sun {...props} />;
                    case 'shield': return <Shield {...props} />;
                    case 'brain': return <Brain {...props} />;
                    case 'book-heart': return <BookHeart {...props} />;
                    case 'play-circle': return <PlayCircle {...props} />;
                    case 'library': return <Library {...props} />;
                    case 'sprout': return <Sprout {...props} />;
                    case 'star': return <Star {...props} />;
                    case 'compass': return <Compass {...props} />;
                    default: return <Activity {...props} />;
                }
            };

            const Thumbnail = ({ src, alt, fallback, className }) => {
                const [error, setError] = useState(false);
                if (error || !src) return fallback;
                return <img src={src} alt={alt} onError={() => setError(true)} className={className} />;
            };

            const colors = {
                primary: '#81638b', secondary: '#b695c0', actionBlue: '#2196f3',
                brainGreen: '#9BC496', white: '#FFFFFF',
            };

            const logoUrl = "https://i.ibb.co/WWs5xcSX/Neuro-Bloom-Logo-nbg.png";

            const Logo = ({ className }) => (
                <div className={`flex items-center gap-3 ${className}`}>
                    <div className="bg-white rounded-xl p-2 inline-block">
                        <img src={logoUrl} alt="Neuro Bloom Logo" className="h-full w-auto object-contain drop-shadow-sm" />
                    </div>
                </div>
            );

            const NavButton = ({ active, onClick, children, icon }) => (
                <button onClick={onClick} className={`flex items-center gap-2 px-5 py-2 rounded-full transition-all duration-300 text-[15px] font-bold tracking-wide border ${active ? 'bg-brand-purple/90 text-white border-brand-purple shadow-md transform scale-105' : 'bg-white/40 text-brand-purple border-white/60 hover:bg-white/70 hover:shadow-sm'}`}>
                    {React.cloneElement(icon, { size: 18, color: active ? colors.white : colors.primary })}
                    <span className="hidden lg:inline">{children}</span>
                </button>
            );

            const BackButton = ({ onClick, text = "Volver", onHome, homeText = "Ir al Inicio" }) => (
                <div className="flex flex-wrap gap-4 mb-8">
                    <button onClick={onClick} className="flex items-center gap-2 text-stone-500 hover:text-brand-purple transition-colors font-bold group w-fit bg-white/60 backdrop-blur-sm px-4 py-2 rounded-full border border-white shadow-sm hover:shadow-md">
                        <ArrowLeft size={18} className="group-hover:-translate-x-1 transition-transform text-brand-purple" />
                        <span className="text-stone-600">{text}</span>
                    </button>
                    {onHome && (
                        <button onClick={onHome} className="flex items-center gap-2 text-stone-500 hover:text-brand-purple transition-colors font-bold group w-fit bg-white/60 backdrop-blur-sm px-4 py-2 rounded-full border border-white shadow-sm hover:shadow-md">
                            <Heart size={18} className="group-hover:scale-110 transition-transform text-brand-purple" />
                            <span className="text-stone-600">{homeText}</span>
                        </button>
                    )}
                </div>
            );

            const CuestionarioView = ({ data, onBack }) => {
                const [respuestas, setRespuestas] = useState({});
                const [resultado, setResultado] = useState(null);

                const calcularPuntaje = () => {
                    const total = Object.values(respuestas).reduce((a, b) => a + b, 0);
                    setResultado(total);
                };

                const obtenerInterpretacion = (puntaje) => {
                    let textoResultado = "";
                    for (let int of data.interpretacion) {
                        const partes = int.rango.match(/(\d+)\s*[-–]\s*(\d+)/);
                        if (partes) {
                            const min = parseInt(partes[1], 10);
                            const max = parseInt(partes[2], 10);
                            if (puntaje >= min && puntaje <= max) {
                                textoResultado = int.texto;
                                break;
                            }
                        }
                    }
                    if (!textoResultado) textoResultado = "Te sugerimos buscar orientación profesional para analizar tus resultados a detalle.";
                    return <p className="text-xl text-stone-700 font-medium leading-relaxed">{textoResultado}</p>;
                };

                return (
                    <div className="animate-fadeIn bg-white/70 backdrop-blur-xl p-8 lg:p-12 rounded-[2rem] shadow-glass border border-white/60 max-w-4xl mx-auto relative z-10">
                        <BackButton onClick={onBack} text="Volver a Cuestionarios" />
                        <div className="flex items-center gap-4 mb-6">
                            <div className="p-3 rounded-full text-white shadow-md" style={{ backgroundColor: data.color || colors.primary }}>
                                {getIconComponent(data.icon)}
                            </div>
                            <h2 className="text-3xl lg:text-4xl font-serif font-bold text-stone-800" style={{ color: colors.primary }}>
                                {data.title}
                            </h2>
                        </div>
                        {data.intro && <p className="text-lg text-stone-600 mb-8 leading-relaxed">{data.intro}</p>}
                        <div className="space-y-6">
                            {data.preguntas.map((pregunta, idx) => (
                                <div key={idx} className="bg-white/80 p-6 rounded-2xl border border-white shadow-sm hover:shadow-md transition-shadow">
                                    <p className="font-semibold text-stone-800 mb-4 text-lg">{idx + 1}. {pregunta}</p>
                                    <div className="flex flex-wrap gap-3">
                                        {data.opciones.map((opc, oIdx) => (
                                            <button key={oIdx} onClick={() => setRespuestas({...respuestas, [idx]: opc.v})} className={`px-5 py-2.5 rounded-full text-sm font-bold transition-all border ${respuestas[idx] === opc.v ? 'bg-white shadow-md scale-105' : 'bg-stone-50/50 border-stone-200 hover:bg-white text-stone-500'}`} style={{ borderColor: respuestas[idx] === opc.v ? (data.color || colors.primary) : '', color: respuestas[idx] === opc.v ? (data.color || colors.primary) : '' }}>
                                                {opc.l}
                                            </button>
                                        ))}
                                    </div>
                                </div>
                            ))}
                        </div>
                        <div className="mt-12 text-center">
                            <button onClick={calcularPuntaje} disabled={Object.keys(respuestas).length < data.preguntas.length} className="px-10 py-4 rounded-full text-white font-bold text-lg shadow-lg disabled:opacity-50 transition-all" style={{ backgroundColor: colors.primary }}>
                                Ver Resultado
                            </button>
                        </div>
                        {resultado !== null && (
                            <div className="mt-12 p-8 lg:p-10 rounded-3xl bg-indigo-50/80 text-center shadow-inner">
                                <h3 className="text-3xl font-serif font-bold mb-6" style={{ color: colors.primary }}>Tu puntuación: {resultado}</h3>
                                <div className="mb-8 text-left max-w-2xl mx-auto p-6 bg-white/90 rounded-2xl shadow-sm">
                                    {obtenerInterpretacion(resultado)}
                                </div>
                            </div>
                        )}
                    </div>
                );
            };

            const RetoPremium = ({ premiumData, onBack, onHome }) => {
                const reto = premiumData.reto_premium || premiumData.reto_del_mes;
                const [step, setStep] = useState(0); 

                if (!reto) return null;

                return (
                    <div className="animate-fadeIn max-w-3xl mx-auto py-12 relative z-10 text-center">
                        <div className="text-left">
                            <BackButton onClick={onBack} text="Volver al Balance" onHome={onHome} />
                        </div>
                        <div className="bg-white/90 backdrop-blur-xl p-10 lg:p-16 rounded-[3rem] border border-white shadow-glass">
                            <Star size={48} className="mx-auto text-yellow-500 mb-6" fill="currentColor" />
                            
                            <div className="animate-fadeIn space-y-6">
                                <h2 className="text-4xl font-serif font-bold text-stone-800 mb-8">{reto.titulo || "Reto del Mes"}</h2>
                                
                                {/* REPRODUCTOR DE AUDIO PRINCIPAL DEL RETO */}
                                {reto.url && (
                                    <div className="my-8 bg-brand-purple/5 p-6 rounded-3xl border border-brand-purple/20">
                                        <h3 className="text-lg font-bold text-brand-purple mb-4 flex items-center justify-center gap-2">
                                            <Headphones size={20}/> Escucha el audio introductorio
                                        </h3>
                                        <audio controls className="w-full rounded-full outline-none shadow-sm">
                                            <source src={reto.url} type="audio/mpeg" />
                                            Tu navegador no soporta la reproducción de audio.
                                        </audio>
                                    </div>
                                )}

                                {(reto.intro || []).map((p, i) => <p key={i} className="text-xl text-stone-600 font-light leading-relaxed">{p}</p>)}
                                
                                <div className="text-center mt-12">
                                    <button onClick={onBack} className="px-8 py-4 bg-stone-800 text-white rounded-full font-bold text-lg shadow-lg hover:-translate-y-1 transition-transform">Volver</button>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }

            // Componente Principal de la App
            function NeuroBloom() {
                const [activeSection, setActiveSection] = useState('home');
                const [subView, setSubView] = useState(null); 
                const [premiumSubSection, setPremiumSubSection] = useState(null);
                const [indTab, setIndTab] = useState('info'); 
                const [appData, setAppData] = useState(null);
                const [dataError, setDataError] = useState(false);

                // Carga de datos local
                useEffect(() => {
                    Promise.all([
                        fetch('./datos_indicadores.json').then(res => res.json()),
                        fetch('./datos_balance.json').then(res => res.json()),
                        fetch('./datos_reto.json').then(res => res.json()),
                        fetch('./datos_capsulas.json').then(res => res.json()),
                        fetch('./datos_especialistas.json').then(res => res.json()),
                        fetch('./datos_infancias.json').then(res => res.json()),
                        fetch('./datos_library.json').then(res => res.json()),
                        fetch('./datos_cuentos.json').then(res => res.json())
                    ])
                    .then(([indicadores, balance, reto_del_mes, capsulas, especialistas, detras_conducta, bloom_library, cuentos]) => {
                        setAppData({ indicadores, balance, reto_del_mes, capsulas, especialistas, detras_conducta, bloom_library, cuentos });
                    })
                    .catch(err => {
                        console.error("Error al cargar los datos:", err);
                        setDataError(true);
                    });
                }, []);

                useEffect(() => { window.scrollTo({ top: 0, behavior: 'smooth' }); }, [activeSection, subView, premiumSubSection]);
                
                useEffect(() => { 
                    setSubView(null); 
                    setPremiumSubSection(null);
                    setIndTab('info');
                }, [activeSection]); 

                if (dataError) return <div className="p-8 text-red-600 text-center font-bold">Error al cargar datos. Verifica los archivos JSON.</div>;
                if (!appData) return <div className="text-center mt-20 text-stone-500">Cargando módulos...</div>;

                const renderContent = () => {
                    if (premiumSubSection === 'reto' && appData.reto_del_mes) {
                        return <RetoPremium premiumData={{reto_premium: appData.reto_del_mes}} onBack={() => {setPremiumSubSection(null); setActiveSection('balance');}} onHome={() => setActiveSection('home')} />;
                    }

                    switch (activeSection) {
                        case 'home':
                            return (
                                <div className="animate-fadeIn flex flex-col items-center justify-center text-center py-8 lg:py-16 relative z-10">
                                    <div className="bg-white rounded-3xl p-4 shadow-sm mb-8 inline-block animate-breathe">
                                        <img src={logoUrl} alt="Neuro Bloom" className="w-full max-w-lg h-auto mx-auto drop-shadow-md" />
                                    </div>
                                    <h1 className="text-2xl md:text-4xl font-serif font-bold tracking-wide mb-6 text-brand-dark" style={{ color: colors.primary }}>“Habitarte también es una forma de florecer”</h1>
                                    <p className="max-w-2xl mb-12 text-lg md:text-xl text-brand-dark/80 leading-relaxed font-light">Un espacio dedicado al bienestar emocional, la creatividad y la conexión humana, floreciendo desde el interior.</p>
                                    
                                    <div className="flex flex-wrap justify-center gap-6 w-full max-w-6xl">
                                        {/* Tarjetas del Dashboard */}
                                        <div onClick={() => setActiveSection('indicadores')} className="w-full sm:w-[45%] lg:w-[30%] cursor-pointer rounded-[2rem] shadow-lg hover:shadow-xl transition-all overflow-hidden group bg-white/60 p-6 flex flex-col items-center">
                                            <Activity size={48} className="text-brand-purple mb-4 group-hover:scale-110 transition-transform"/>
                                            <h3 className="font-bold text-xl text-stone-700">Indicadores</h3>
                                        </div>
                                        <div onClick={() => setActiveSection('balance')} className="w-full sm:w-[45%] lg:w-[30%] cursor-pointer rounded-[2rem] shadow-lg hover:shadow-xl transition-all overflow-hidden group bg-white/60 p-6 flex flex-col items-center">
                                            <Sun size={48} className="text-blue-400 mb-4 group-hover:scale-110 transition-transform"/>
                                            <h3 className="font-bold text-xl text-stone-700">Vida en Equilibrio</h3>
                                        </div>
                                        <div onClick={() => setActiveSection('library')} className="w-full sm:w-[45%] lg:w-[30%] cursor-pointer rounded-[2rem] shadow-lg hover:shadow-xl transition-all overflow-hidden group bg-white/60 p-6 flex flex-col items-center">
                                            <Library size={48} className="text-brand-lilac mb-4 group-hover:scale-110 transition-transform"/>
                                            <h3 className="font-bold text-xl text-stone-700">Librería Bloom</h3>
                                        </div>
                                        <div onClick={() => setActiveSection('infancias')} className="w-full sm:w-[45%] lg:w-[30%] cursor-pointer rounded-[2rem] shadow-lg hover:shadow-xl transition-all overflow-hidden group bg-white/60 p-6 flex flex-col items-center">
                                            <Sprout size={48} className="text-pink-400 mb-4 group-hover:scale-110 transition-transform"/>
                                            <h3 className="font-bold text-xl text-stone-700">Infancias</h3>
                                        </div>
                                        <div onClick={() => setActiveSection('capsulas')} className="w-full sm:w-[45%] lg:w-[30%] cursor-pointer rounded-[2rem] shadow-lg hover:shadow-xl transition-all overflow-hidden group bg-white/60 p-6 flex flex-col items-center">
                                            <PlayCircle size={48} className="text-orange-400 mb-4 group-hover:scale-110 transition-transform"/>
                                            <h3 className="font-bold text-xl text-stone-700">Cápsulas</h3>
                                        </div>
                                        <div onClick={() => setActiveSection('citas')} className="w-full sm:w-[45%] lg:w-[30%] cursor-pointer rounded-[2rem] shadow-lg hover:shadow-xl transition-all overflow-hidden group bg-white/60 p-6 flex flex-col items-center">
                                            <Calendar size={48} className="text-brand-green mb-4 group-hover:scale-110 transition-transform"/>
                                            <h3 className="font-bold text-xl text-stone-700">Especialistas</h3>
                                        </div>
                                    </div>
                                </div>
                            );

                        case 'indicadores':
                            if (subView) {
                                const infoData = appData.indicadores?.informacion?.find(d => d.id === subView);
                                if (infoData) {
                                    return (
                                        <div className="animate-fadeIn bg-white/80 backdrop-blur-xl p-8 lg:p-14 rounded-[2.5rem] shadow-glass border border-white max-w-4xl mx-auto relative z-10">
                                            <BackButton onClick={() => setSubView(null)} text="Volver a Información" />
                                            <div className="flex items-center gap-5 mb-10 border-b border-stone-200/50 pb-8">
                                                <div className="p-4 rounded-full text-white shadow-md" style={{ backgroundColor: infoData.color }}>
                                                    {getIconComponent(infoData.icon, {size: 32})}
                                                </div>
                                                <h2 className="text-4xl lg:text-5xl font-serif font-bold text-stone-800" style={{ color: colors.primary }}>
                                                    {infoData.title}
                                                </h2>
                                            </div>
                                            <div className="space-y-6 text-lg text-stone-700 leading-relaxed font-light text-justify">
                                                {infoData.contenido.map((parrafo, idx) => <p key={idx}>{parrafo}</p>)}
                                            </div>
                                        </div>
                                    );
                                }
                                const testData = appData.indicadores?.cuestionarios?.find(d => d.id === subView);
                                if (testData) return <CuestionarioView data={testData} onBack={() => setSubView(null)} />;
                            }
                            return (
                                <div className="animate-fadeIn max-w-6xl mx-auto space-y-12 relative z-10">
                                    <BackButton onClick={() => setActiveSection('home')} text="Volver al Inicio" />
                                    <div className="text-center mb-10">
                                        <h2 className="text-5xl font-serif font-bold mb-6 text-stone-800" style={{ color: colors.primary }}>Indicadores Emocionales</h2>
                                    </div>
                                    <div className="flex justify-center flex-wrap gap-2 sm:gap-4 bg-white/50 backdrop-blur-md p-2 rounded-full shadow-glass border border-white w-fit mx-auto">
                                        <button onClick={() => setIndTab('info')} className={`px-8 py-3 rounded-full font-bold transition-all text-lg ${indTab === 'info' ? 'bg-white shadow-sm text-brand-purple' : 'text-stone-500'}`}>Información</button>
                                        <button onClick={() => setIndTab('test')} className={`px-8 py-3 rounded-full font-bold transition-all text-lg ${indTab === 'test' ? 'bg-white shadow-sm text-brand-purple' : 'text-stone-500'}`}>Cuestionarios</button>
                                    </div>
                                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 pt-6">
                                        {indTab === 'info' && appData.indicadores?.informacion?.map(item => (
                                            <div key={item.id} onClick={() => setSubView(item.id)} className="cursor-pointer bg-white/70 p-8 rounded-[2rem] shadow-glass border border-white hover:shadow-lg transition-all text-center">
                                                <h3 className="text-xl font-bold text-stone-800">{item.title}</h3>
                                            </div>
                                        ))}
                                        {indTab === 'test' && appData.indicadores?.cuestionarios?.map(item => (
                                            <div key={item.id} onClick={() => setSubView(item.id)} className="cursor-pointer bg-white/70 p-8 rounded-[2rem] shadow-glass border border-white hover:shadow-lg transition-all text-center">
                                                <h3 className="text-xl font-bold text-stone-800">{item.title}</h3>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            );

                        case 'balance':
                            return (
                                <div className="animate-fadeIn max-w-4xl mx-auto py-8 relative z-10">
                                    <BackButton onClick={() => setActiveSection('home')} text="Volver al Inicio" />
                                    <div className="bg-white/80 p-10 rounded-[2.5rem] shadow-glass border border-white">
                                        <div className="flex items-center gap-4 mb-6">
                                            <Sun size={40} className="text-blue-500" />
                                            <h2 className="text-4xl font-serif font-bold text-stone-800">{appData.balance.title}</h2>
                                        </div>
                                        <div className="space-y-6 text-lg text-stone-700 leading-relaxed font-light text-justify mb-10">
                                            {appData.balance.contenido.map((p, idx) => <p key={idx}>{p}</p>)}
                                        </div>
                                        
                                        {/* ACCESO AL RETO DEL MES */}
                                        <div className="bg-gradient-to-r from-yellow-50 to-amber-100 p-8 rounded-3xl border border-yellow-200 text-center">
                                            <Star size={40} className="mx-auto text-yellow-500 mb-4" />
                                            <h3 className="text-2xl font-bold text-stone-800 mb-4">Reto del Mes</h3>
                                            <button onClick={() => setPremiumSubSection('reto')} className="px-8 py-4 bg-yellow-500 text-white rounded-full font-bold shadow-md hover:-translate-y-1 transition-transform">Ver Reto</button>
                                        </div>
                                    </div>
                                </div>
                            );

                        case 'capsulas':
                            return (
                                <div className="animate-fadeIn max-w-6xl mx-auto space-y-12 relative z-10">
                                    <BackButton onClick={() => setActiveSection('home')} text="Volver al Inicio" />
                                    <div className="text-center mb-10">
                                        <h2 className="text-5xl font-serif font-bold mb-6 text-stone-800">Cápsulas en Video</h2>
                                    </div>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                                        {appData.capsulas.map(cap => (
                                            <div key={cap.id} className="bg-white/80 p-6 rounded-3xl shadow-glass border border-white">
                                                <h3 className="text-2xl font-bold text-brand-purple mb-4">{cap.title}</h3>
                                                {cap.youtube_id && (
                                                    <div className="relative w-full aspect-video rounded-xl overflow-hidden shadow-md mb-4">
                                                        <iframe className="absolute top-0 left-0 w-full h-full" src={`https://www.youtube.com/embed/${cap.youtube_id}`} frameBorder="0" allowFullScreen></iframe>
                                                    </div>
                                                )}
                                                <div className="text-stone-600 font-light space-y-2 text-sm">{cap.guion.slice(0, 2).map((p, i) => <p key={i}>{p}</p>)}</div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            );

                        case 'citas':
                            return (
                                <div className="animate-fadeIn max-w-4xl mx-auto py-8 relative z-10">
                                    <BackButton onClick={() => setActiveSection('home')} text="Volver al Inicio" />
                                    <h2 className="text-4xl font-serif font-bold text-center mb-10 text-brand-green">Especialistas</h2>
                                    <div className="space-y-8">
                                        {appData.especialistas.map(esp => (
                                            <div key={esp.id} className="bg-white/80 p-8 rounded-3xl shadow-glass border border-white flex flex-col md:flex-row gap-8">
                                                <div className="w-full md:w-2/3">
                                                    <h3 className="text-2xl font-bold text-stone-800">{esp.nombre}</h3>
                                                    <p className="text-brand-green font-bold mb-2">{esp.titulo}</p>
                                                    <p className="text-stone-500 mb-4">{esp.descripcion}</p>
                                                    <ul className="list-disc list-inside text-stone-600">
                                                        {esp.enfoques.map((e, i) => <li key={i}>{e}</li>)}
                                                    </ul>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            );

                        case 'infancias':
                            return (
                                <div className="animate-fadeIn max-w-4xl mx-auto py-8 relative z-10">
                                    <BackButton onClick={() => setActiveSection('home')} text="Volver al Inicio" />
                                    <div className="bg-white/80 p-10 rounded-[2.5rem] shadow-glass border border-white">
                                        <h2 className="text-4xl font-serif font-bold text-pink-500 mb-6">{appData.detras_conducta.title}</h2>
                                        <div className="space-y-4 text-stone-700 text-lg">
                                            {appData.detras_conducta.contenido.map((p, idx) => (
                                                <p key={idx} className={p === "---" ? "border-b border-stone-200 my-4" : ""}>{p !== "---" ? p : ""}</p>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            );

                        case 'library':
                            return (
                                <div className="animate-fadeIn max-w-4xl mx-auto py-8 relative z-10">
                                    <BackButton onClick={() => setActiveSection('home')} text="Volver al Inicio" />
                                    <div className="bg-white/80 p-10 rounded-[2.5rem] shadow-glass border border-white">
                                        <h2 className="text-4xl font-serif font-bold text-brand-lilac mb-6">Librería Bloom</h2>
                                        <div className="space-y-4 text-stone-700 text-lg">
                                            {appData.bloom_library.intro_text.map((p, idx) => <p key={idx}>{p}</p>)}
                                        </div>
                                    </div>
                                </div>
                            );

                        default:
                            return <div className="text-center mt-20">Sección en construcción.</div>;
                    }
                };

                return (
                    <div className="min-h-screen relative font-sans text-stone-800">
                        {/* Fondo Decorativo */}
                        <div className="fixed inset-0 z-0 overflow-hidden pointer-events-none">
                            <div className="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-brand-lilac/10 rounded-full blur-[120px]"></div>
                            <div className="absolute bottom-[-10%] right-[-10%] w-[50%] h-[50%] bg-brand-blue/10 rounded-full blur-[150px]"></div>
                        </div>

                        {/* Contenido Principal */}
                        <div className="relative z-10 p-4 md:p-8 lg:p-12 pb-32">
                            {renderContent()}
                        </div>
                    </div>
                );
            }

            const root = ReactDOM.createRoot(document.getElementById('root'));
            root.render(<NeuroBloom />);
        } catch (error) {
            console.error("Error general:", error);
            document.getElementById('root').innerHTML = `<div style="padding: 2rem; color: red;">Error al iniciar la aplicación: ${error.message}</div>`;
        }
    </script>
</body>
</html>
