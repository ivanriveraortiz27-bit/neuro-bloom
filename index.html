<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neuro Bloom - Creciendo con cada emoción</title>
    
    <link rel="icon" href="https://i.ibb.co/WWs5xcSX/Neuro-Bloom-Logo-nbg.png" type="image/png">
    <link rel="stylesheet" href="styles.css">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.23.6/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <!-- Configuración personalizada de Tailwind -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Nunito', 'sans-serif'],
                        serif: ['Lora', 'serif'],
                    },
                    colors: {
                        brand: {
                            purple: '#81638b',
                            lilac: '#b695c0',
                            green: '#9BC496',
                            blue: '#81c9fa',
                            dark: '#4a444d'
                        }
                    },
                    boxShadow: {
                        'glass': '0 8px 32px 0 rgba(129, 99, 139, 0.05)',
                    }
                }
            }
        }
    </script>
</head>
<body>
    <div id="root">
        <div class="loading-screen">
            <h2 class="loading-title">Cargando Neuro Bloom...</h2>
            <p>Si este mensaje no desaparece en unos segundos, revisa tu conexión a internet.</p>
        </div>
    </div>

    <script type="text/babel">
        try {
            // Inicialización de Firebase
            const firebaseConfig = {
                apiKey: "AIzaSyDDrImW6-xUfu5TdamXe0HH0eawlME-yZI",
                authDomain: "neuro-bloom-5313d.firebaseapp.com",
                projectId: "neuro-bloom-5313d",
                storageBucket: "neuro-bloom-5313d.firebasestorage.app",
                messagingSenderId: "727914123954",
                appId: "1:727914123954:web:2b4e961315b999647f6fab"
            };
            
            if (!firebase.apps.length) {
                firebase.initializeApp(firebaseConfig);
            }
            const auth = firebase.auth();
            const db = firebase.firestore();

            const { useState, useEffect, useRef } = React;

            // --- Iconos Globales ---
            const IconWrapper = ({ name, size = 24, className, color, fill = "none", ...props }) => {
                const iconRef = useRef(null);
                useEffect(() => {
                    if (window.lucide) {
                        window.lucide.createIcons({
                            root: iconRef.current,
                            nameAttr: 'data-lucide',
                            attrs: { width: size, height: size, stroke: color || 'currentColor', fill: fill, class: className, ...props }
                        });
                    }
                }, [name, size, className, color, fill]);
                return <i ref={iconRef} data-lucide={name} style={{ display: 'inline-flex' }}></i>;
            };

            const Heart = (props) => <IconWrapper name="heart" {...props} />;
            const Activity = (props) => <IconWrapper name="activity" {...props} />;
            const HeartHandshake = (props) => <IconWrapper name="heart-handshake" {...props} />;
            const Sun = (props) => <IconWrapper name="sun" {...props} />;
            const Calendar = (props) => <IconWrapper name="calendar" {...props} />;
            const Menu = (props) => <IconWrapper name="menu" {...props} />;
            const X = (props) => <IconWrapper name="x" {...props} />;
            const ArrowLeft = (props) => <IconWrapper name="arrow-left" {...props} />;
            const Shield = (props) => <IconWrapper name="shield" {...props} />;
            const Brain = (props) => <IconWrapper name="brain" {...props} />;
            const BookHeart = (props) => <IconWrapper name="book-heart" {...props} />;
            const PlayCircle = (props) => <IconWrapper name="play-circle" {...props} />;
            const Library = (props) => <IconWrapper name="library" {...props} />;
            const Sprout = (props) => <IconWrapper name="sprout" {...props} />;
            const Star = (props) => <IconWrapper name="star" {...props} />;
            const UserCircle = (props) => <IconWrapper name="user-circle" {...props} />;
            const Loader = (props) => <IconWrapper name="loader" {...props} className="animate-spin" />;
            const Compass = (props) => <IconWrapper name="compass" {...props} />;
            const Lock = (props) => <IconWrapper name="lock" {...props} />;
            const CheckCircle = (props) => <IconWrapper name="check-circle" {...props} />;
            
            const MessageCircle = (props) => <IconWrapper name="message-circle" {...props} />;
            const PenTool = (props) => <IconWrapper name="pen-tool" {...props} />;
            const Headphones = (props) => <IconWrapper name="headphones" {...props} />;
            const FileText = (props) => <IconWrapper name="file-text" {...props} />;
            const Leaf = (props) => <IconWrapper name="leaf" {...props} />;

            const getIconComponent = (name, props = {}) => {
                switch(name) {
                    case 'activity': return <Activity {...props} />;
                    case 'heart': return <Heart {...props} />;
                    case 'heart-handshake': return <HeartHandshake {...props} />;
                    case 'sun': return <Sun {...props} />;
                    case 'shield': return <Shield {...props} />;
                    case 'brain': return <Brain {...props} />;
                    case 'book-heart': return <BookHeart {...props} />;
                    case 'play-circle': return <PlayCircle {...props} />;
                    case 'library': return <Library {...props} />;
                    case 'sprout': return <Sprout {...props} />;
                    case 'star': return <Star {...props} />;
                    case 'compass': return <Compass {...props} />;
                    default: return <Activity {...props} />;
                }
            };

            const Thumbnail = ({ src, alt, fallback, className }) => {
                const [error, setError] = useState(false);
                if (error || !src) return fallback;
                return <img src={src} alt={alt} onError={() => setError(true)} className={className} />;
            };

            const colors = {
                primary: '#81638b', secondary: '#b695c0', actionBlue: '#2196f3',
                brainGreen: '#9BC496', white: '#FFFFFF',
            };

            const logoUrl = "https://i.ibb.co/WWs5xcSX/Neuro-Bloom-Logo-nbg.png";

            const Logo = ({ className }) => (
                <div className={`flex items-center gap-3 ${className}`}>
                    <img src={logoUrl} alt="Neuro Bloom Logo" className="h-full w-auto object-contain drop-shadow-sm" />
                </div>
            );

            const NavButton = ({ active, onClick, children, icon }) => (
                <button onClick={onClick} className={`flex items-center gap-2 px-5 py-2 rounded-full transition-all duration-300 text-[15px] font-bold tracking-wide border ${active ? 'bg-brand-purple/90 text-white border-brand-purple shadow-md transform scale-105' : 'bg-white/40 text-brand-purple border-white/60 hover:bg-white/70 hover:shadow-sm'}`}>
                    {React.cloneElement(icon, { size: 18, color: active ? colors.white : colors.primary })}
                    <span className="hidden lg:inline">{children}</span>
                </button>
            );

            // Botón dual mejorado para volver al inicio general o al menú premium
            const BackButton = ({ onClick, text = "Volver", onHome, homeText = "Ir al Inicio" }) => (
                <div className="flex flex-wrap gap-4 mb-8">
                    <button onClick={onClick} className="flex items-center gap-2 text-stone-500 hover:text-brand-purple transition-colors font-bold group w-fit bg-white/60 backdrop-blur-sm px-4 py-2 rounded-full border border-white shadow-sm">
                        <ArrowLeft size={18} className="group-hover:-translate-x-1 transition-transform text-brand-purple" />
                        <span className="text-stone-600">{text}</span>
                    </button>
                    {onHome && (
                        <button onClick={onHome} className="flex items-center gap-2 text-stone-500 hover:text-brand-purple transition-colors font-bold group w-fit bg-white/60 backdrop-blur-sm px-4 py-2 rounded-full border border-white shadow-sm">
                            <Heart size={18} className="group-hover:scale-110 transition-transform text-brand-purple" />
                            <span className="text-stone-600">{homeText}</span>
                        </button>
                    )}
                </div>
            );

            // --- Cuestionarios Generales (Info) ---
            const CuestionarioView = ({ data, onBack }) => {
                const [respuestas, setRespuestas] = useState({});
                const [resultado, setResultado] = useState(null);

                const calcularPuntaje = () => {
                    const total = Object.values(respuestas).reduce((a, b) => a + b, 0);
                    setResultado(total);
                };

                const obtenerInterpretacion = (puntaje) => {
                    let textoResultado = "";
                    let advertenciaExtra = "";

                    if (data.id === 'depresion-test' && respuestas[12] >= 2) {
                        advertenciaExtra = "Importante: Si en la pregunta 13 respondiste 'Frecuentemente' o 'Casi todo el tiempo', es recomendable buscar apoyo profesional lo antes posible, incluso si tu puntaje total no es elevado.";
                    }

                    for (let int of data.interpretacion) {
                        const partes = int.rango.match(/(\d+)\s*[-–]\s*(\d+)/);
                        if (partes) {
                            const min = parseInt(partes[1], 10);
                            const max = parseInt(partes[2], 10);
                            if (puntaje >= min && puntaje <= max) {
                                textoResultado = int.texto;
                                break;
                            }
                        }
                    }
                    if (!textoResultado) textoResultado = "Te sugerimos buscar orientación profesional para analizar tus resultados a detalle.";

                    return (
                        <div className="space-y-4">
                            <p className="text-xl text-stone-700 font-medium leading-relaxed">{textoResultado}</p>
                            {advertenciaExtra && (
                                <div className="mt-4 p-4 bg-orange-100 border-l-4 border-orange-500 text-orange-800 rounded-lg text-left">
                                    <strong className="block mb-1 text-orange-900">Atención:</strong>
                                    {advertenciaExtra}
                                </div>
                            )}
                        </div>
                    );
                };

                return (
                    <div className="animate-fadeIn bg-white/70 backdrop-blur-xl p-8 lg:p-12 rounded-[2rem] shadow-glass border border-white/60 max-w-4xl mx-auto relative z-10">
                        <BackButton onClick={onBack} text="Volver a Cuestionarios" />
                        <div className="flex items-center gap-4 mb-6">
                            <div className="p-3 rounded-full text-white shadow-md" style={{ backgroundColor: data.color || colors.primary }}>
                                {getIconComponent(data.icon)}
                            </div>
                            <h2 className="text-3xl lg:text-4xl font-serif font-bold text-stone-800" style={{ color: colors.primary }}>{data.title}</h2>
                        </div>
                        {data.intro && <p className="text-lg text-stone-600 mb-8 leading-relaxed whitespace-pre-line">{data.intro}</p>}
                        <div className="space-y-6">
                            {data.preguntas.map((pregunta, idx) => (
                                <div key={idx} className="bg-white/80 p-6 rounded-2xl border border-white shadow-sm hover:shadow-md transition-shadow">
                                    <p className="font-semibold text-stone-800 mb-4 text-lg">{idx + 1}. {pregunta}</p>
                                    <div className="flex flex-wrap gap-3">
                                        {data.opciones.map((opc, oIdx) => (
                                            <button key={oIdx} onClick={() => setRespuestas({...respuestas, [idx]: opc.v})} className={`px-5 py-2.5 rounded-full text-sm font-bold transition-all border ${respuestas[idx] === opc.v ? 'bg-white shadow-md scale-105' : 'bg-stone-50/50 border-stone-200 hover:border-stone-300 text-stone-500 hover:bg-white'}`} style={{ borderColor: respuestas[idx] === opc.v ? (data.color || colors.primary) : '', color: respuestas[idx] === opc.v ? (data.color || colors.primary) : '' }}>
                                                {opc.l}
                                            </button>
                                        ))}
                                    </div>
                                </div>
                            ))}
                        </div>
                        <div className="mt-12 text-center">
                            <button onClick={calcularPuntaje} disabled={Object.keys(respuestas).length < data.preguntas.length} className="px-10 py-4 rounded-full text-white font-bold text-lg shadow-lg disabled:opacity-50 disabled:cursor-not-allowed transition-all hover:-translate-y-1" style={{ backgroundColor: colors.primary }}>
                                Ver Resultado
                            </button>
                            {Object.keys(respuestas).length < data.preguntas.length && (
                                <p className="text-stone-400 text-sm mt-3">Responde todas las preguntas para ver tu resultado.</p>
                            )}
                        </div>
                        {resultado !== null && (
                            <div className="mt-12 p-8 lg:p-10 rounded-3xl bg-indigo-50/80 backdrop-blur-sm border border-indigo-100 animate-slideIn text-center shadow-inner">
                                <h3 className="text-3xl font-serif font-bold mb-6" style={{ color: colors.primary }}>Tu puntuación total: {resultado}</h3>
                                <div className="mb-8 text-left max-w-2xl mx-auto p-6 bg-white/90 rounded-2xl border border-white shadow-sm">
                                    {obtenerInterpretacion(resultado)}
                                </div>
                                <div className="p-6 bg-white/60 rounded-3xl text-stone-600 text-sm shadow-sm border border-white text-left">
                                    <p className="font-bold mb-2">Recuerda:</p>
                                    <p>Reconocer cómo nos sentimos es el primer paso para cuidar nuestra salud mental. Pedir ayuda profesional también es una forma de autocuidado.</p>
                                    <p className="mt-2 italic">Este cuestionario no sustituye una evaluación clínica ni constituye un diagnóstico.</p>
                                </div>
                            </div>
                        )}
                    </div>
                );
            };

            const PerfilEmocional = ({ premiumData, onBack, onHome }) => {
                const perfil = premiumData.perfil_emocional;
                const [dimActual, setDimActual] = useState(-1);
                const [respuestas, setRespuestas] = useState({});

                const iniciarTest = () => { setDimActual(0); setRespuestas({}); };
                const handleRespuesta = (dimId, qIdx, valor) => {
                    setRespuestas(prev => ({ ...prev, [dimId]: { ...prev[dimId], [qIdx]: valor } }));
                };
                const avanzarDimension = () => {
                    setDimActual(prev => prev + 1);
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                };

                const calcularResultadosFinales = () => {
                    let resultados = [];
                    perfil.dimensiones.forEach(dim => {
                        let puntaje = 0;
                        dim.preguntas.forEach((q, idx) => {
                            let valor = respuestas[dim.id]?.[idx] || 0;
                            if (q.invertida) valor = 4 - valor;
                            puntaje += valor;
                        });
                        const nivelObj = dim.resultados.find(r => puntaje >= r.rango[0] && puntaje <= r.rango[1]);
                        resultados.push({ titulo: dim.titulo, descripcion: dim.descripcion, puntaje, ...nivelObj });
                    });
                    return resultados;
                };

                if (dimActual === -1) {
                    return (
                        <div className="animate-fadeIn max-w-4xl mx-auto py-12 relative z-10">
                            <BackButton onClick={onBack} text="Volver a Premium" onHome={onHome} />
                            <div className="bg-white/80 backdrop-blur-xl p-10 lg:p-16 rounded-[3rem] border border-white shadow-glass text-center">
                                <Brain size={80} className="mx-auto text-brand-purple mb-8 animate-pulse" />
                                <h2 className="text-4xl lg:text-5xl font-serif font-bold text-stone-800 mb-8">Conoce tu Perfil Emocional</h2>
                                <p className="text-xl text-stone-600 mb-10 leading-relaxed max-w-2xl mx-auto whitespace-pre-line font-light">{perfil.intro}</p>
                                <button onClick={iniciarTest} className="px-10 py-5 bg-brand-purple text-white rounded-full font-bold text-xl shadow-xl hover:shadow-2xl transform hover:-translate-y-1 transition-all">
                                    🌸 Comenzar evaluación
                                </button>
                            </div>
                        </div>
                    );
                }

                if (dimActual >= 0 && dimActual < perfil.dimensiones.length) {
                    const dim = perfil.dimensiones[dimActual];
                    const numPreguntas = dim.preguntas.length;
                    const respondidas = Object.keys(respuestas[dim.id] || {}).length;
                    const progreso = ((dimActual) / perfil.dimensiones.length) * 100;

                    return (
                        <div className="animate-fadeIn max-w-4xl mx-auto py-8 relative z-10">
                            <div className="w-full bg-white/50 rounded-full h-3 mb-8 shadow-inner overflow-hidden border border-white">
                                <div className="bg-brand-purple h-3 rounded-full transition-all duration-500" style={{ width: `${progreso}%` }}></div>
                            </div>
                            <div className="bg-white/90 backdrop-blur-xl p-8 lg:p-14 rounded-[2.5rem] border border-white shadow-glass">
                                <div className="mb-10 text-center border-b border-stone-100 pb-8">
                                    <h2 className="text-3xl lg:text-4xl font-serif font-bold text-brand-purple mb-4">{dim.titulo}</h2>
                                    <p className="text-lg text-stone-500 font-light max-w-2xl mx-auto">{dim.descripcion}</p>
                                </div>
                                <div className="space-y-8">
                                    {dim.preguntas.map((q, idx) => (
                                        <div key={idx} className="bg-stone-50/50 p-6 lg:p-8 rounded-3xl border border-white hover:shadow-md transition-shadow">
                                            <p className="font-bold text-stone-800 mb-6 text-lg lg:text-xl">{q.texto}</p>
                                            <div className="flex flex-wrap gap-3 lg:gap-4">
                                                {perfil.escala.map((opc, oIdx) => {
                                                    const isSelected = respuestas[dim.id]?.[idx] === opc.v;
                                                    return (
                                                        <button key={oIdx} onClick={() => handleRespuesta(dim.id, idx, opc.v)} className={`flex-grow sm:flex-grow-0 px-6 py-3 rounded-2xl text-sm font-bold transition-all border ${isSelected ? 'bg-brand-purple text-white shadow-lg border-brand-purple scale-105' : 'bg-white border-stone-200 text-stone-500 hover:border-brand-purple hover:text-brand-purple'}`}>
                                                            {opc.l}
                                                        </button>
                                                    );
                                                })}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                                <div className="mt-12 pt-8 border-t border-stone-100 flex items-center justify-between">
                                    <p className="text-stone-400 font-bold">{respondidas} de {numPreguntas} respondidas</p>
                                    <button onClick={avanzarDimension} disabled={respondidas < numPreguntas} className="px-8 py-4 bg-brand-purple text-white rounded-full font-bold text-lg shadow-md disabled:opacity-50 disabled:cursor-not-allowed hover:-translate-y-1 transition-transform flex items-center gap-2">
                                        {dimActual === perfil.dimensiones.length - 1 ? 'Ver Resultados' : 'Siguiente Dimensión'} &rarr;
                                    </button>
                                </div>
                            </div>
                        </div>
                    );
                }

                if (dimActual === perfil.dimensiones.length) {
                    const resultados = calcularResultadosFinales();
                    return (
                        <div className="animate-fadeIn max-w-5xl mx-auto py-12 relative z-10">
                            <div className="text-center mb-16">
                                <CheckCircle size={64} className="mx-auto text-brand-green mb-6 animate-bounce" style={{animationDuration: '2s'}}/>
                                <h2 className="text-5xl font-serif font-bold text-stone-800 mb-4">Tu Perfil Emocional</h2>
                                <p className="text-xl text-stone-600 font-light">Este es el análisis de tus 7 dimensiones y nuestras rutas sugeridas para ti.</p>
                            </div>
                            <div className="space-y-10">
                                {resultados.map((res, idx) => (
                                    <div key={idx} className="bg-white/90 backdrop-blur-xl rounded-[2.5rem] border border-white shadow-glass overflow-hidden">
                                        <div className={`p-8 border-b border-white flex flex-col sm:flex-row sm:items-center justify-between gap-6 ${res.bg}`}>
                                            <div>
                                                <h3 className="text-2xl font-serif font-bold text-stone-800">{res.titulo}</h3>
                                                <p className="text-stone-600 font-light mt-1">{res.descripcion}</p>
                                            </div>
                                            <div className="bg-white px-6 py-3 rounded-2xl shadow-sm border border-white text-center min-w-[120px]">
                                                <p className={`text-xl font-black ${res.color}`}>{res.nivel}</p>
                                            </div>
                                        </div>
                                        <div className="p-8 lg:p-10">
                                            <div className="mb-8">
                                                <h4 className="font-bold text-brand-purple uppercase tracking-wider mb-3 text-sm">¿Qué significa tu resultado?</h4>
                                                <p className="text-stone-700 leading-relaxed">{res.desc}</p>
                                            </div>
                                            <div className="mb-8">
                                                <h4 className="font-bold text-stone-800 uppercase tracking-wider mb-3 text-sm">Esto podría reflejarse en tu día a día:</h4>
                                                <p className="text-stone-600 italic border-l-4 border-stone-200 pl-4 py-1">{res.reflejo}</p>
                                            </div>
                                            <div className="bg-stone-50/80 p-6 rounded-2xl border border-stone-100">
                                                <h4 className="font-bold text-brand-green uppercase tracking-wider mb-4 text-sm flex items-center gap-2">
                                                    <Sprout size={16} /> Rutas Sugeridas
                                                </h4>
                                                <ul className="space-y-3">
                                                    <li className="flex items-start gap-3"><span className="text-brand-purple font-black">•</span><span><strong className="text-stone-700">Ruta principal:</strong> <span className="text-stone-600">{res.ruta_prin}</span></span></li>
                                                    <li className="flex items-start gap-3"><span className="text-brand-lilac font-black">•</span><span><strong className="text-stone-700">Ruta complementaria:</strong> <span className="text-stone-600">{res.ruta_comp}</span></span></li>
                                                </ul>
                                            </div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                            <div className="mt-16 text-center">
                                <button onClick={onBack} className="px-10 py-5 bg-stone-800 text-white rounded-full font-bold text-xl shadow-xl hover:shadow-2xl transform hover:-translate-y-1 transition-all">
                                    Ir a Mis Rutas
                                </button>
                            </div>
                        </div>
                    );
                }
                return null;
            };

            const RutasBienestar = ({ premiumData, onBack, onHome }) => {
                const [activeRuta, setActiveRuta] = useState(null);
                const [activeModulo, setActiveModulo] = useState(0);

                if (!activeRuta) {
                    return (
                        <div className="animate-fadeIn max-w-6xl mx-auto py-12 relative z-10">
                            <BackButton onClick={onBack} text="Volver a Premium" onHome={onHome} />
                            <div className="text-center mb-16">
                                <Compass size={64} className="mx-auto text-brand-green mb-6" />
                                <h2 className="text-4xl lg:text-5xl font-serif font-bold text-stone-800 mb-4">Mis Rutas de Bienestar</h2>
                                <p className="text-xl text-stone-600 font-light">Explora los programas guiados para acompañar tu proceso emocional.</p>
                            </div>
                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 px-4">
                                {premiumData.rutas.map((ruta, idx) => (
                                    <button 
                                        key={idx} 
                                        onClick={() => {setActiveRuta(ruta); setActiveModulo(0);}} 
                                        className="text-left bg-white/80 backdrop-blur-xl p-8 rounded-[2rem] border border-white shadow-glass hover:shadow-xl transition-all transform hover:-translate-y-1 flex flex-col group"
                                    >
                                        <div className="mb-4 text-brand-green group-hover:scale-110 transition-transform"><Leaf size={32} /></div>
                                        <h3 className="text-2xl font-serif font-bold text-stone-800 mb-3">{ruta.titulo}</h3>
                                        <p className="text-stone-500 font-light line-clamp-3 leading-relaxed">{ruta.descripcion}</p>
                                        <div className="mt-6 text-brand-green font-bold text-sm uppercase tracking-widest">Ingresar &rarr;</div>
                                    </button>
                                ))}
                            </div>
                        </div>
                    );
                }

                const modulo = activeRuta.modulos[activeModulo];

                return (
                    <div className="animate-fadeIn max-w-4xl mx-auto py-8 relative z-10">
                        <BackButton onClick={() => setActiveRuta(null)} text="Volver a Rutas" onHome={onHome} />
                        <div className="bg-white/90 backdrop-blur-xl rounded-[3rem] border border-white shadow-glass overflow-hidden">
                            <div className="p-8 lg:p-10 border-b border-stone-100 bg-gradient-to-r from-stone-50 to-white">
                                <h2 className="text-3xl lg:text-4xl font-serif font-bold text-stone-800 mb-2">{activeRuta.titulo}</h2>
                            </div>
                            
                            <div className="flex overflow-x-auto border-b border-stone-100 bg-white/50 no-scrollbar">
                                {activeRuta.modulos.map((m, idx) => (
                                    <button 
                                        key={idx} 
                                        onClick={() => setActiveModulo(idx)} 
                                        className={`px-8 py-5 font-bold whitespace-nowrap transition-colors ${activeModulo === idx ? 'text-brand-purple border-b-4 border-brand-purple bg-stone-50/50' : 'text-stone-400 hover:text-stone-600'}`}
                                    >
                                        Módulo {idx + 1}
                                    </button>
                                ))}
                            </div>
                            
                            <div className="p-8 lg:p-14 space-y-12">
                                <h3 className="text-3xl font-serif font-bold text-stone-800 mb-8">{modulo.titulo}</h3>
                                
                                {modulo.psicoeducacion && (
                                    <div className="space-y-6">
                                        <div className="flex items-center gap-3 text-brand-purple font-bold uppercase tracking-widest text-sm">
                                            <Brain size={20} /> Psicoeducación
                                        </div>
                                        <h4 className="text-2xl font-serif font-bold text-stone-800">{modulo.psicoeducacion.titulo}</h4>
                                        <div className="space-y-4 text-stone-600 font-light leading-relaxed text-lg text-justify">
                                            {modulo.psicoeducacion.parrafos.map((p, i) => <p key={i}>{p}</p>)}
                                        </div>
                                    </div>
                                )}

                                {modulo.te_ha_pasado && modulo.te_ha_pasado.length > 0 && (
                                    <div className="bg-brand-purple/5 p-8 rounded-3xl border border-brand-purple/10">
                                        <div className="flex items-center gap-3 text-brand-purple font-bold uppercase tracking-widest text-sm mb-6">
                                            <MessageCircle size={20} /> ¿Te ha pasado que...?
                                        </div>
                                        <ul className="space-y-4">
                                            {modulo.te_ha_pasado.map((item, i) => (
                                                <li key={i} className="flex gap-3 text-stone-700 font-light text-lg">
                                                    <span className="text-brand-purple mt-1">•</span> {item}
                                                </li>
                                            ))}
                                        </ul>
                                    </div>
                                )}

                                {modulo.ejercicio && (
                                    <div className="bg-stone-50 p-8 rounded-3xl border border-stone-100">
                                        <div className="flex items-center gap-3 text-stone-500 font-bold uppercase tracking-widest text-sm mb-6">
                                            <PenTool size={20} /> Ejercicio NeuroBloom
                                        </div>
                                        <h4 className="text-2xl font-serif font-bold text-stone-800 mb-4">{modulo.ejercicio.titulo}</h4>
                                        <p className="text-stone-600 font-light mb-6 text-lg">{modulo.ejercicio.instrucciones}</p>
                                        <div className="space-y-4">
                                            {modulo.ejercicio.pasos.map((paso, i) => (
                                                <div key={i} className="bg-white p-6 rounded-2xl shadow-sm border border-stone-100 text-stone-700 font-light">{paso}</div>
                                            ))}
                                        </div>
                                    </div>
                                )}

                                {modulo.audio && (
                                    <div className="bg-gradient-to-r from-brand-lilac/20 to-brand-purple/20 p-8 rounded-3xl border border-brand-purple/20 flex flex-col sm:flex-row items-center justify-between gap-6 shadow-sm">
                                        <div className="w-full text-center sm:text-left">
                                            <div className="flex items-center justify-center sm:justify-start gap-3 text-brand-purple font-bold uppercase tracking-widest text-sm mb-2">
                                                <Headphones size={20} /> {modulo.audio.duracion}
                                            </div>
                                            <h4 className="text-xl font-serif font-bold text-stone-800">{modulo.audio.titulo}</h4>
                                        </div>
                                        <button className="w-16 h-16 rounded-full bg-brand-purple text-white flex items-center justify-center shadow-lg hover:scale-105 transition-transform flex-shrink-0">
                                            <PlayCircle size={32} />
                                        </button>
                                    </div>
                                )}

                                {modulo.hoja_trabajo && (
                                    <div className="space-y-6">
                                        <div className="flex items-center gap-3 text-actionBlue font-bold uppercase tracking-widest text-sm">
                                            <FileText size={20} /> Hoja de Trabajo
                                        </div>
                                        <h4 className="text-2xl font-serif font-bold text-stone-800">{modulo.hoja_trabajo.titulo}</h4>
                                        <div className="bg-white border-2 border-dashed border-stone-200 p-8 rounded-3xl space-y-4 text-stone-600 font-light text-lg">
                                            {modulo.hoja_trabajo.contenido.map((c, i) => <p key={i}>{c}</p>)}
                                        </div>
                                    </div>
                                )}

                                {modulo.reto && (
                                    <div className="bg-brand-green/10 p-8 rounded-3xl border border-brand-green/20">
                                        <div className="flex items-center gap-3 text-brand-green font-bold uppercase tracking-widest text-sm mb-6">
                                            <Leaf size={20} /> Práctica de la Semana
                                        </div>
                                        <h4 className="text-2xl font-serif font-bold text-stone-800 mb-4">{modulo.reto.titulo}</h4>
                                        <div className="space-y-4 text-stone-700 font-light text-lg">
                                            {modulo.reto.contenido.map((c, i) => <p key={i}>{c}</p>)}
                                        </div>
                                    </div>
                                )}

                                {modulo.cierre && modulo.cierre.length > 0 && (
                                    <div className="border-t border-stone-100 pt-12 space-y-6 text-center">
                                        <HeartHandshake size={48} className="mx-auto text-brand-lilac mb-6" />
                                        <div className="space-y-4 text-stone-600 font-light text-lg max-w-2xl mx-auto">
                                            {modulo.cierre.map((c, i) => <p key={i}>{c}</p>)}
                                        </div>
                                    </div>
                                )}

                            </div>
                        </div>
                    </div>
                );
            };

            // --- Componente: Reto Premium (La Última Página) ---
            const RetoPremium = ({ premiumData, onBack, onHome }) => {
                const reto = premiumData.reto_premium;
                const [step, setStep] = useState(0); 

                if (!reto) return null;

                return (
                    <div className="animate-fadeIn max-w-3xl mx-auto py-12 relative z-10 text-center">
                        <div className="text-left">
                            <BackButton onClick={onBack} text="Volver a Premium" onHome={onHome} />
                        </div>

                        <div className="bg-white/90 backdrop-blur-xl p-10 lg:p-16 rounded-[3rem] border border-white shadow-glass">
                            <Star size={48} className="mx-auto text-yellow-500 mb-6" fill="currentColor" />
                            
                            {step === 0 && (
                                <div className="animate-fadeIn space-y-6">
                                    <h2 className="text-4xl font-serif font-bold text-stone-800 mb-8">{reto.titulo}</h2>
                                    {reto.intro.map((p, i) => <p key={i} className="text-xl text-stone-600 font-light leading-relaxed">{p}</p>)}
                                    <button onClick={() => setStep(1)} className="mt-8 px-8 py-4 bg-stone-800 text-white rounded-full font-bold text-lg shadow-lg hover:-translate-y-1 transition-transform">Continuar</button>
                                </div>
                            )}

                            {step === 1 && (
                                <div className="animate-fadeIn space-y-6 text-left">
                                    {reto.desarrollo.map((p, i) => <p key={i} className="text-lg text-stone-700 font-light leading-relaxed">{p}</p>)}
                                    <div className="bg-brand-purple/5 p-8 rounded-2xl border border-brand-purple/20 my-8">
                                        <h3 className="text-2xl font-serif font-bold text-brand-purple mb-4">{reto.pregunta_1}</h3>
                                        <textarea className="w-full bg-white border border-stone-200 rounded-xl p-4 min-h-[120px] focus:outline-none focus:border-brand-purple focus:ring-2 focus:ring-brand-purple/20 resize-none" placeholder="Escribe aquí con total honestidad..."></textarea>
                                    </div>
                                    <div className="text-center">
                                        <button onClick={() => setStep(2)} className="px-8 py-4 bg-brand-purple text-white rounded-full font-bold text-lg shadow-lg hover:-translate-y-1 transition-transform">Siguiente</button>
                                    </div>
                                </div>
                            )}

                            {step === 2 && (
                                <div className="animate-fadeIn space-y-6 text-left">
                                    {reto.reflexion_1.map((p, i) => <p key={i} className="text-lg text-stone-700 font-light leading-relaxed">{p}</p>)}
                                    <div className="my-8 border-t border-b border-stone-100 py-8 space-y-6">
                                        {reto.transicion.map((p, i) => <p key={i} className="text-lg text-stone-700 font-light leading-relaxed">{p}</p>)}
                                    </div>
                                    <div className="bg-brand-green/10 p-8 rounded-2xl border border-brand-green/20 my-8">
                                        <h3 className="text-2xl font-serif font-bold text-brand-green mb-4">{reto.pregunta_2}</h3>
                                        <textarea className="w-full bg-white border border-stone-200 rounded-xl p-4 min-h-[120px] focus:outline-none focus:border-brand-green focus:ring-2 focus:ring-brand-green/20 resize-none" placeholder="Tómate tu tiempo para recordar..."></textarea>
                                    </div>
                                    <div className="text-center">
                                        <button onClick={() => setStep(3)} className="px-8 py-4 bg-brand-green text-white rounded-full font-bold text-lg shadow-lg hover:-translate-y-1 transition-transform">Finalizar Reflexión</button>
                                    </div>
                                </div>
                            )}

                            {step === 3 && (
                                <div className="animate-fadeIn space-y-6 text-left">
                                    <div className="space-y-6 mb-12">
                                        {reto.cierre.map((p, i) => <p key={i} className="text-lg text-stone-700 font-bold leading-relaxed">{p}</p>)}
                                    </div>
                                    <hr className="border-stone-200 mb-12" />
                                    <div className="space-y-6">
                                        {reto.despedida.map((p, i) => <p key={i} className="text-lg text-stone-600 font-light leading-relaxed">{p}</p>)}
                                    </div>
                                    <div className="bg-stone-50 p-8 rounded-2xl border border-stone-200 mt-12">
                                        <p className="text-stone-500 font-light whitespace-pre-line italic">{reto.teaser_proximo}</p>
                                    </div>
                                    <div className="text-center mt-12">
                                        <button onClick={onBack} className="px-8 py-4 bg-stone-800 text-white rounded-full font-bold text-lg shadow-lg hover:-translate-y-1 transition-transform">Volver a Premium</button>
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>
                );
            }

            const AuthModal = ({ onClose }) => {
                const [isLogin, setIsLogin] = useState(true);
                const [email, setEmail] = useState('');
                const [password, setPassword] = useState('');
                const [error, setError] = useState('');
                const [loading, setLoading] = useState(false);

                const handleSubmit = async (e) => {
                    e.preventDefault();
                    setLoading(true);
                    setError('');
                    try {
                        if (isLogin) {
                            const userCredential = await auth.signInWithEmailAndPassword(email, password);
                            const docRef = db.collection('users').doc(userCredential.user.uid);
                            const docSnap = await docRef.get();
                            if (!docSnap.exists) {
                                await docRef.set({
                                    email: userCredential.user.email,
                                    isPremium: false,
                                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                                });
                            }
                        } else {
                            const userCredential = await auth.createUserWithEmailAndPassword(email, password);
                            await db.collection('users').doc(userCredential.user.uid).set({
                                email: userCredential.user.email,
                                isPremium: false,
                                createdAt: firebase.firestore.FieldValue.serverTimestamp()
                            });
                        }
                        onClose();
                    } catch (err) {
                        let msg = err.message;
                        if (err.code === 'auth/invalid-credential' || err.code === 'auth/user-not-found' || err.code === 'auth/wrong-password') msg = 'Correo o contraseña incorrectos.';
                        else if (err.code === 'auth/email-already-in-use') msg = 'Este correo ya está registrado.';
                        else if (err.code === 'auth/weak-password') msg = 'La contraseña debe tener al menos 6 caracteres.';
                        setError(msg);
                    }
                    setLoading(false);
                };

                return (
                    <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-stone-900/40 backdrop-blur-sm animate-fadeIn">
                        <div className="bg-white/95 backdrop-blur-xl p-8 rounded-[2rem] shadow-2xl border border-white max-w-md w-full relative">
                            <button onClick={onClose} className="absolute top-4 right-4 p-2 bg-stone-100/80 rounded-full text-stone-500 hover:bg-stone-200 hover:text-stone-800 transition-colors"><X size={20} /></button>
                            <div className="text-center mb-8 mt-2">
                                <h3 className="text-3xl font-serif font-bold text-brand-purple mb-2">{isLogin ? 'Iniciar Sesión' : 'Crear Cuenta'}</h3>
                                <p className="text-stone-500 font-light text-sm">{isLogin ? 'Ingresa a tu espacio en Neuro Bloom' : 'Comienza tu proceso con nosotros'}</p>
                            </div>
                            <form onSubmit={handleSubmit} className="space-y-5">
                                <div>
                                    <label className="block text-sm font-bold text-stone-700 mb-1">Correo Electrónico</label>
                                    <input type="email" value={email} onChange={(e) => setEmail(e.target.value)} className="w-full px-4 py-3 rounded-xl border border-stone-200 focus:border-brand-purple focus:ring-2 focus:ring-brand-purple/20 outline-none transition-all bg-white/50" required />
                                </div>
                                <div>
                                    <label className="block text-sm font-bold text-stone-700 mb-1">Contraseña</label>
                                    <input type="password" value={password} onChange={(e) => setPassword(e.target.value)} className="w-full px-4 py-3 rounded-xl border border-stone-200 focus:border-brand-purple focus:ring-2 focus:ring-brand-purple/20 outline-none transition-all bg-white/50" required />
                                </div>
                                {error && <p className="text-red-500 text-sm font-bold text-center bg-red-50 p-2 rounded-lg">{error}</p>}
                                <button type="submit" disabled={loading} className="w-full py-4 mt-2 bg-brand-purple text-white rounded-xl font-bold shadow-md hover:shadow-lg transform hover:-translate-y-0.5 transition-all flex justify-center items-center gap-2 disabled:opacity-70 disabled:cursor-not-allowed">
                                    {loading ? <Loader size={20} /> : (isLogin ? 'Ingresar' : 'Registrarme')}
                                </button>
                            </form>
                            <div className="mt-6 text-center border-t border-stone-100 pt-6 flex flex-col gap-4">
                                <p className="text-stone-500 text-sm">{isLogin ? '¿Aún no tienes cuenta?' : '¿Ya tienes cuenta?'} <button onClick={() => {setIsLogin(!isLogin); setError('');}} className="ml-2 text-brand-purple font-bold hover:underline">{isLogin ? 'Regístrate aquí' : 'Inicia Sesión'}</button></p>
                            </div>
                        </div>
                    </div>
                );
            };

            function NeuroBloom() {
                const [activeSection, setActiveSection] = useState('home');
                const [subView, setSubView] = useState(null); 
                const [premiumSubSection, setPremiumSubSection] = useState(null); 
                
                const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
                const [user, setUser] = useState(null);
                const [isPremium, setIsPremium] = useState(false);
                const [authLoading, setAuthLoading] = useState(true);
                const [showAuthModal, setShowAuthModal] = useState(false);
                
                const [appData, setAppData] = useState(null);
                const [premiumData, setPremiumData] = useState(null);
                const [dataError, setDataError] = useState(false);

                // Autenticación en tiempo real
                useEffect(() => {
                    let unsubscribeSnapshot = null;
                    const unsubscribeAuth = auth.onAuthStateChanged(async (currentUser) => {
                        if (currentUser) {
                            try {
                                await currentUser.getIdToken(true);
                                unsubscribeSnapshot = db.collection('users').doc(currentUser.uid).onSnapshot(async (doc) => {
                                    if (!doc.exists) {
                                        if (unsubscribeSnapshot) unsubscribeSnapshot();
                                        await auth.signOut();
                                        setUser(null); setIsPremium(false); setAuthLoading(false);
                                        return;
                                    }
                                    let isUserPremium = doc.data().isPremium === true;
                                    const urlParams = new URLSearchParams(window.location.search);
                                    if (urlParams.get('payment') === 'success' && !isUserPremium) {
                                        await db.collection('users').doc(currentUser.uid).update({ isPremium: true });
                                        window.history.replaceState(null, '', window.location.pathname);
                                        alert('¡Pago completado con éxito! Ya puedes acceder a Bloom Premium. 🌟');
                                        setActiveSection('premium_view');
                                        return; 
                                    }
                                    setUser(currentUser);
                                    setIsPremium(isUserPremium);
                                    setAuthLoading(false);
                                }, (error) => { console.error("Error al escuchar usuario:", error); setAuthLoading(false); });
                            } catch (error) {
                                console.error("Error:", error);
                                await auth.signOut(); setUser(null); setIsPremium(false); setAuthLoading(false);
                            }
                        } else {
                            if (unsubscribeSnapshot) unsubscribeSnapshot();
                            setUser(null); setIsPremium(false); setAuthLoading(false);
                        }
                    });
                    return () => { unsubscribeAuth(); if (unsubscribeSnapshot) unsubscribeSnapshot(); };
                }, []);

                // Carga de Data Pública
                useEffect(() => {
                    fetch('./data.json')
                        .then(res => { if (!res.ok) throw new Error("No data"); return res.json(); })
                        .then(data => setAppData(data))
                        .catch(err => { console.error(err); setDataError(true); });
                }, []);

                // Carga de Data Premium
                useEffect(() => {
                    if (activeSection === 'premium_view' && !premiumData) {
                        fetch('./premium_data.json')
                            .then(res => { if (!res.ok) throw new Error("No premium data"); return res.json(); })
                            .then(data => setPremiumData(data))
                            .catch(err => { console.error("Error cargando premium data", err); });
                    }
                }, [activeSection]);

                useEffect(() => { window.scrollTo({ top: 0, behavior: 'smooth' }); }, [activeSection, subView, premiumSubSection]);
                useEffect(() => { setSubView(null); setPremiumSubSection(null); }, [activeSection]); 

                const handlePremiumClick = () => {
                    if (!user) setShowAuthModal(true);
                    else if (!isPremium) window.open('https://buy.stripe.com/5kQeVc2NH6wJ9EVfM377O00', 'PagoPremium', 'width=500,height=750,left=200,top=100');
                    else setActiveSection('premium_view');
                };

                const handleLogout = async () => { await auth.signOut(); setActiveSection('home'); };

                if (dataError) return <div className="loading-screen bg-red-50 text-stone-800 p-8"><h2 className="text-2xl text-red-600 font-bold mb-4 font-serif">Error al cargar datos</h2></div>;
                if (!appData || authLoading) return <div className="loading-screen"><h2 className="loading-title animate-pulse">Despertando Neuro Bloom...</h2></div>;

                const renderContent = () => {
                    switch (activeSection) {
                        case 'home':
                            return (
                                <div className="animate-fadeIn flex flex-col items-center justify-center text-center py-8 lg:py-16 relative z-10">
                                    <img src={logoUrl} alt="Neuro Bloom" className="w-full max-w-lg h-auto mx-auto drop-shadow-md mb-8" />
                                    <h1 className="text-2xl md:text-4xl font-serif font-bold tracking-wide mb-6 text-brand-dark" style={{ color: colors.primary }}>“Habitarte también es una forma de florecer”</h1>
                                    <p className="max-w-2xl mb-12 text-lg md:text-xl text-brand-dark/80 leading-relaxed font-light">Un espacio dedicado al bienestar emocional, la creatividad y la conexión humana, floreciendo desde el interior.</p>

                                    <div className="flex justify-center mb-16 w-full animate-bounce" style={{animationDuration: '3s'}}>
                                        <button onClick={handlePremiumClick} className="px-8 py-4 bg-gradient-to-r from-amber-400 to-yellow-500 text-white rounded-full font-bold text-xl shadow-lg hover:shadow-xl transform hover:-translate-y-1 transition-all flex items-center gap-3 border-2 border-yellow-300">
                                            <Star size={28} fill="currentColor" /> Bloom Premium
                                        </button>
                                    </div>
                                    
                                    <div className="flex flex-wrap justify-center gap-6 w-full max-w-6xl">
                                        <div onClick={() => setActiveSection('indicadores')} className="w-full sm:w-[45%] lg:w-[30%] cursor-pointer rounded-[2rem] shadow-lg hover:shadow-xl transition-all overflow-hidden group">
                                            <Thumbnail src="./indicadores-emocionales.jpeg" alt="Indicadores" className="w-full h-auto block transition-transform duration-500 group-hover:scale-105" fallback={<div className="w-full py-16 bg-white/60 flex items-center justify-center"><Activity size={64} className="text-brand-purple" /></div>} />
                                        </div>
                                        <div onClick={() => setActiveSection('balance')} className="w-full sm:w-[45%] lg:w-[30%] cursor-pointer rounded-[2rem] shadow-lg hover:shadow-xl transition-all overflow-hidden group">
                                            <Thumbnail src="./balance-cotidiano.jpeg" alt="Balance" className="w-full h-auto block transition-transform duration-500 group-hover:scale-105" fallback={<div className="w-full py-16 bg-white/60 flex items-center justify-center"><Sun size={64} className="text-blue-400" /></div>} />
                                        </div>
                                        <div onClick={() => setActiveSection('library')} className="w-full sm:w-[45%] lg:w-[30%] cursor-pointer rounded-[2rem] shadow-lg hover:shadow-xl transition-all overflow-hidden group">
                                            <Thumbnail src="./bloom-library.jpeg" alt="Library" className="w-full h-auto block transition-transform duration-500 group-hover:scale-105" fallback={<div className="w-full py-16 bg-white/60 flex items-center justify-center"><Library size={64} className="text-brand-lilac" /></div>} />
                                        </div>
                                        <div onClick={() => setActiveSection('infancias')} className="w-full sm:w-[45%] lg:w-[30%] cursor-pointer rounded-[2rem] shadow-lg hover:shadow-xl transition-all overflow-hidden group">
                                            <Thumbnail src="./infancias.jpeg" alt="Infancias" className="w-full h-auto block transition-transform duration-500 group-hover:scale-105" fallback={<div className="w-full py-16 bg-white/60 flex items-center justify-center"><Sprout size={64} className="text-pink-400" /></div>} />
                                        </div>
                                        <div onClick={() => setActiveSection('capsulas')} className="w-full sm:w-[45%] lg:w-[30%] cursor-pointer rounded-[2rem] shadow-lg hover:shadow-xl transition-all overflow-hidden group">
                                            <Thumbnail src="./capsulas-en-video.jpeg" alt="Cápsulas" className="w-full h-auto block transition-transform duration-500 group-hover:scale-105" fallback={<div className="w-full py-16 bg-white/60 flex items-center justify-center"><PlayCircle size={64} className="text-orange-400" /></div>} />
                                        </div>
                                        <div onClick={() => setActiveSection('citas')} className="w-full sm:w-[45%] lg:w-[30%] cursor-pointer rounded-[2rem] shadow-lg hover:shadow-xl transition-all overflow-hidden group">
                                            <Thumbnail src="./conoce-y-agenda.jpeg" alt="Agenda" className="w-full h-auto block transition-transform duration-500 group-hover:scale-105" fallback={<div className="w-full py-16 bg-white/60 flex items-center justify-center"><Calendar size={64} className="text-brand-green" /></div>} />
                                        </div>
                                    </div>
                                </div>
                            );

                        case 'indicadores':
                            if (subView) {
                                const infoData = appData.indicadores?.informacion?.find(d => d.id === subView);
                                if (infoData) {
                                    return (
                                        <div className="animate-fadeIn bg-white/80 backdrop-blur-xl p-8 lg:p-14 rounded-[2.5rem] shadow-glass border border-white max-w-4xl mx-auto relative z-10">
                                            <BackButton onClick={() => setSubView(null)} text="Volver a Información" />
                                            {infoData.imagen && (
                                                <div className="mb-12 w-full flex justify-center bg-white rounded-3xl p-4 sm:p-6 border border-stone-100 shadow-sm">
                                                    <img src={infoData.imagen} alt={infoData.title} className="max-w-full rounded-2xl object-contain max-h-[60vh]" />
                                                </div>
                                            )}
                                            <div className="flex items-center gap-5 mb-10 border-b border-stone-200/50 pb-8">
                                                <div className="p-4 rounded-full text-white shadow-md" style={{ backgroundColor: infoData.color }}>
                                                    {getIconComponent(infoData.icon, {size: 32})}
                                                </div>
                                                <h2 className="text-4xl lg:text-5xl font-serif font-bold text-stone-800" style={{ color: colors.primary }}>{infoData.title}</h2>
                                            </div>
                                            <div className="space-y-6 text-lg text-stone-700 leading-relaxed font-light text-justify">
                                                {infoData.contenido.map((parrafo, idx) => {
                                                    if(parrafo.includes(':') && parrafo.split(':')[0].length < 50) {
                                                        const parts = parrafo.split(':');
                                                        return <p key={idx}><strong className="text-stone-800">{parts[0]}:</strong>{parts.slice(1).join(':')}</p>;
                                                    }
                                                    return <p key={idx}>{parrafo}</p>;
                                                })}
                                            </div>
                                        </div>
                                    );
                                }
                                const testData = appData.indicadores?.cuestionarios?.find(d => d.id === subView);
                                if (testData) return <CuestionarioView data={testData} onBack={() => setSubView(null)} />;
                            }
                            return (
                                <div className="animate-fadeIn max-w-6xl mx-auto space-y-12 relative z-10">
                                    <div className="w-full">
                                        <BackButton onClick={() => setActiveSection('home')} text="Volver al Inicio" />
                                    </div>
                                    <div className="text-center mb-10">
                                        <h2 className="text-5xl font-serif font-bold mb-6 text-stone-800" style={{ color: colors.primary }}>Indicadores Emocionales</h2>
                                        <p className="text-stone-600 max-w-2xl mx-auto text-xl font-light">Infórmate sobre tu salud emocional y realiza ejercicios de autoexploración.</p>
                                    </div>
                                    <div className="flex justify-center flex-wrap gap-2 sm:gap-4 bg-white/50 backdrop-blur-md p-2 rounded-full shadow-glass border border-white w-fit mx-auto">
                                        <button onClick={() => setSubView('info')} className="px-8 py-3 rounded-full font-bold transition-all text-lg bg-white shadow-sm text-brand-purple">Información</button>
                                    </div>
                                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 pt-6">
                                        {appData.indicadores?.informacion?.map(item => (
                                            <div key={item.id} onClick={() => setSubView(item.id)} className="cursor-pointer bg-white/70 backdrop-blur-lg p-8 rounded-[2rem] shadow-glass border border-white hover:shadow-lg transition-all group flex flex-col hover:-translate-y-1">
                                                <Thumbnail src={item.imagen} alt={item.title} className="w-20 h-20 rounded-2xl object-cover mb-6 shadow-sm group-hover:scale-105 transition-transform border-2 border-white" fallback={<div className="w-16 h-16 rounded-2xl flex items-center justify-center mb-6 group-hover:scale-105 transition-transform text-white shadow-sm" style={{ backgroundColor: item.color }}>{getIconComponent(item.icon)}</div>} />
                                                <h3 className="text-2xl font-serif font-bold mb-3 text-stone-800 group-hover:text-brand-purple transition-colors">{item.title}</h3>
                                                <p className="text-[15px] text-stone-500 line-clamp-3 flex-grow leading-relaxed font-light">{item.contenido[0]}</p>
                                                <p className="text-sm font-bold text-brand-purple mt-6 tracking-wider uppercase">Leer artículo &rarr;</p>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            );

                        case 'balance':
                            const renderContenidoTexto = (parrafos) => {
                                return parrafos.map((parrafo, idx) => {
                                    if (parrafo === '---') return <hr key={idx} className="my-10 border-stone-200" />;
                                    if (parrafo.includes('⭐') || parrafo.includes('🔒')) {
                                        const textoLimpio = parrafo.replace('⭐', '').replace('🔒', '').trim();
                                        return (
                                            <button key={idx} onClick={handlePremiumClick} className="w-full py-5 mt-6 rounded-2xl bg-gradient-to-r from-amber-400 to-yellow-500 text-white font-bold text-xl shadow-lg hover:shadow-xl transform hover:-translate-y-1 transition-all flex justify-center items-center gap-3 border-2 border-yellow-300">
                                                <Star size={28} fill="currentColor" /> {textoLimpio}
                                            </button>
                                        );
                                    }
                                    if (parrafo.match(/^[✨🌸💌☕🌿🗓️✍️🌱🎧💬🤍🧠🎥🎬🪷🌧️🔥💛🚧]/) || parrafo === parrafo.toUpperCase()) {
                                        return <h3 key={idx} className="text-2xl font-serif font-bold text-brand-purple mt-10 mb-4">{parrafo}</h3>;
                                    }
                                    return <p key={idx}>{parrafo}</p>;
                                });
                            };
                            return (
                                <div className="animate-fadeIn max-w-5xl mx-auto space-y-8 relative z-10">
                                    <BackButton onClick={() => setActiveSection('home')} text="Volver al Inicio" />
                                    <div className="text-center mb-10">
                                        <h2 className="text-5xl font-serif font-bold mb-6 text-stone-800" style={{ color: colors.primary }}>Balance Cotidiano</h2>
                                        <p className="text-stone-600 max-w-2xl mx-auto text-xl font-light">Estrategias y retos para construir bienestar emocional paso a paso.</p>
                                    </div>
                                    <div className="bg-white/80 backdrop-blur-xl p-8 lg:p-14 rounded-[2.5rem] shadow-glass border border-white animate-fadeIn">
                                        {appData.balance.imagen && (
                                            <div className="mb-12 w-full flex justify-center bg-white rounded-3xl p-4 sm:p-6 border border-stone-100 shadow-sm">
                                                <img src={appData.balance.imagen} alt="Hábitos Sanos" className="max-w-full rounded-2xl object-contain max-h-[70vh]" />
                                            </div>
                                        )}
                                        <div className="flex items-center gap-5 mb-10 border-b border-stone-200/50 pb-8">
                                            <div className="p-4 rounded-full text-white shadow-md bg-blue-400">
                                                {getIconComponent(appData.balance.icon, {size: 32})}
                                            </div>
                                            <h2 className="text-4xl lg:text-5xl font-serif font-bold text-stone-800">{appData.balance.title}</h2>
                                        </div>
                                        <div className="space-y-6 text-lg text-stone-700 leading-relaxed font-light text-justify">
                                            {appData.balance.contenido.map((parrafo, idx) => <p key={idx}>{parrafo}</p>)}
                                        </div>
                                    </div>
                                </div>
                            );

                        case 'library':
                            return (
                                <div className="animate-fadeIn max-w-4xl mx-auto py-12 relative z-10">
                                    <BackButton onClick={() => setActiveSection('home')} text="Volver al Inicio" />
                                    <div className="text-center">
                                        <h2 className="text-5xl font-serif font-bold mb-6 text-stone-800">Bloom Library</h2>
                                        <p className="text-stone-600 mb-12 text-xl font-light">Un espacio para nutrir tu mente y alma a través de recursos, recomendaciones y cuentos terapéuticos.</p>
                                        <div className="p-20 bg-white/70 backdrop-blur-xl rounded-[3rem] border border-white shadow-glass flex flex-col items-center justify-center relative z-10">
                                            <Library size={100} className="text-brand-lilac mb-8 animate-pulse" />
                                            <h3 className="text-3xl font-serif font-bold text-stone-500 mb-4">Próximamente</h3>
                                            <p className="text-stone-500 max-w-md mx-auto text-lg font-light">Estamos protegiendo la magia de nuestras historias. El contenido estará disponible una vez finalizado el registro de derechos de autor.</p>
                                        </div>
                                    </div>
                                </div>
                            );

                        case 'infancias':
                            return (
                                <div className="animate-fadeIn max-w-5xl mx-auto space-y-8 relative z-10">
                                    <BackButton onClick={() => setActiveSection('home')} text="Volver al Inicio" />
                                    <div className="text-center mb-10">
                                        <h2 className="text-5xl font-serif font-bold mb-6 text-stone-800" style={{ color: colors.primary }}>Infancias que Florecen</h2>
                                        <p className="text-stone-600 max-w-2xl mx-auto text-xl font-light">Desarrollo emocional infantil para comprender antes que juzgar.</p>
                                    </div>
                                    <div className="bg-white/80 backdrop-blur-xl p-8 lg:p-14 rounded-[2.5rem] shadow-glass border border-white animate-fadeIn">
                                        <div className="flex items-center gap-5 mb-10 border-b border-stone-200/50 pb-8">
                                            <div className="p-4 rounded-full text-white shadow-md bg-pink-400"><Sprout size={32} /></div>
                                            <h2 className="text-3xl lg:text-4xl font-serif font-bold text-stone-800">{appData.detras_conducta?.title || "🪷 Detrás de su conducta"}</h2>
                                        </div>
                                        <div className="space-y-6 text-lg text-stone-700 leading-relaxed font-light text-justify">
                                            {appData.detras_conducta?.contenido.map((parrafo, idx) => {
                                                if (parrafo === '---') return <hr key={idx} className="my-10 border-stone-200" />;
                                                if (parrafo.match(/^[✨🌸💌☕🌿🗓️✍️🌱🎧💬🤍🧠🎥🎬🪷🌧️🔥💛🚧]/) || parrafo === parrafo.toUpperCase()) {
                                                    return <h3 key={idx} className="text-2xl font-serif font-bold text-brand-purple mt-10 mb-4">{parrafo}</h3>;
                                                }
                                                return <p key={idx}>{parrafo}</p>;
                                            })}
                                        </div>
                                    </div>
                                </div>
                            );

                        case 'capsulas':
                            return (
                                <div className="animate-fadeIn max-w-4xl mx-auto py-12 relative z-10">
                                    <BackButton onClick={() => setActiveSection('home')} text="Volver al Inicio" />
                                    <div className="text-center">
                                        <h2 className="text-5xl font-serif font-bold mb-6 text-orange-400">Cápsulas en Video</h2>
                                        <p className="text-stone-600 mb-12 text-xl font-light">Espacio reservado para próximas reflexiones y guías audiovisuales de Neuro Bloom.</p>
                                        <div className="p-20 bg-white/70 backdrop-blur-xl rounded-[3rem] border border-white shadow-glass flex flex-col items-center justify-center relative z-10">
                                            <PlayCircle size={100} className="text-orange-200 mb-8 animate-pulse" />
                                            <h3 className="text-3xl font-serif font-bold text-stone-500 mb-4">Próximamente</h3>
                                            <p className="text-stone-500 max-w-md mx-auto text-lg font-light">Estamos preparando el contenido en video para acompañar tu proceso de bienestar emocional.</p>
                                        </div>
                                    </div>
                                </div>
                            );

                        case 'citas':
                            return (
                                <div className="animate-fadeIn max-w-5xl mx-auto space-y-12 relative z-10">
                                    <BackButton onClick={() => setActiveSection('home')} text="Volver al Inicio" />
                                    <div className="text-center mb-16">
                                        <h2 className="text-5xl font-serif font-bold mb-6 text-stone-800">Conoce y Agenda Cita</h2>
                                        <p className="text-stone-600 max-w-2xl mx-auto text-xl font-light">Inicia tu proceso de bienestar emocional. Conoce a nuestros especialistas y reserva tu espacio seguro con nosotros.</p>
                                    </div>
                                    <div className="grid md:grid-cols-2 gap-10 relative z-10">
                                        {appData.especialistas?.map(esp => (
                                            <div key={esp.id} className="bg-white/80 backdrop-blur-xl rounded-[2.5rem] shadow-glass border border-white overflow-hidden flex flex-col hover:shadow-xl transition-all group">
                                                <div className="w-full h-80 bg-stone-50 overflow-hidden relative border-b border-white">
                                                    <Thumbnail src={esp.imagen} alt={esp.nombre} className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-700" fallback={<Activity size={80} className="text-stone-300 absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2" />} />
                                                </div>
                                                <div className="p-10 flex flex-col flex-grow">
                                                    <h3 className="text-3xl font-serif font-bold text-stone-800 mb-2">{esp.nombre}</h3>
                                                    <p className="text-brand-green font-bold text-lg mb-3">{esp.titulo}</p>
                                                    {esp.cedula && <p className="text-sm text-stone-400 mb-5 font-mono">Cédula: {esp.cedula}</p>}
                                                    <p className="text-stone-600 text-[15px] mb-8 italic font-light leading-relaxed">{esp.descripcion}</p>
                                                    <div className="mb-10 flex-grow">
