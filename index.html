<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neuro Bloom - Creciendo con cada emoción</title>
    
    <link rel="icon" href="https://i.ibb.co/WWs5xcSX/Neuro-Bloom-Logo-nbg.png" type="image/png">
    <link rel="stylesheet" href="styles.css">
    
    <!-- Fuente Figtree requerida para UltimaPagina -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.23.6/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <!-- Configuración personalizada de Tailwind -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Nunito', 'sans-serif'],
                        serif: ['Lora', 'serif'],
                        // Agregamos Figtree a la configuración para usarla con Tailwind si es necesario
                        figtree: ['Figtree', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            purple: '#81638b',
                            lilac: '#b695c0',
                            green: '#9BC496',
                            blue: '#81c9fa',
                            dark: '#4a444d'
                        }
                    },
                    boxShadow: {
                        'glass': '0 8px 32px 0 rgba(129, 99, 139, 0.06)',
                        'premium': '0 15px 40px -10px rgba(251, 191, 36, 0.15)',
                    }
                }
            }
        }
    </script>
    <style>
        /* Animaciones para las formas del fondo (blobs) */
        @keyframes blob {
            0% { transform: translate(0px, 0px) scale(1); }
            33% { transform: translate(30px, -50px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
            100% { transform: translate(0px, 0px) scale(1); }
        }
        .animate-blob {
            animation: blob 7s infinite;
        }
        .animation-delay-2000 {
            animation-delay: 2s;
        }
        .animation-delay-4000 {
            animation-delay: 4s;
        }
    </style>
</head>
<body>
    <div id="root">
        <div class="loading-screen">
            <h2 class="loading-title">Cargando Neuro Bloom...</h2>
            <p>Si este mensaje no desaparece en unos segundos, revisa tu conexión a internet.</p>
        </div>
    </div>

    <!-- Componentes en orden de dependencia -->
    <script type="text/babel" src="components/00-base.js"></script>
    <script type="text/babel" src="components/CuestionarioView.js"></script>
    <script type="text/babel" src="components/PerfilEmocional.js"></script>
    <script type="text/babel" src="components/RutasBienestar.js"></script>
    <script type="text/babel" src="components/MaternidadView.js"></script>
    <script type="text/babel" src="components/RetoPremium.js"></script>
    <script type="text/babel" src="components/UltimaPagina.js"></script>
    <script type="text/babel" src="components/AuthModal.js"></script>
    <script type="text/babel" src="components/PanelAdmin.js"></script>
    <script type="text/babel" src="components/PanelPsicologo.js"></script>
    <script type="text/babel" src="components/Conocenos.js"></script>
    <script type="text/babel" src="components/NeuroBloom.js"></script>
</body>
</html>
